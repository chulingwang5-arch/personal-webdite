<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050506">

  <title>Still Becoming — A Living Archive</title>

  <meta
    name="description"
    content="A personal living archive of identity, thoughts, reading and becoming."
  >

  <style>
    /* =====================================================
       01. GLOBAL SETTINGS
       ===================================================== */

    :root {
      --black: #050506;
      --white: #e8e8e5;
      --silver: #85858b;

      --green: #416c49;
      --green-light: #608a64;

      --wine: #35151e;
      --wine-light: #49202a;

      --line: rgba(210, 215, 220, 0.15);
      --line-soft: rgba(210, 215, 220, 0.075);

      --ui-size: 10px;
      --page-padding: 34px;

      --mono:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        Menlo,
        monospace;

      --serif:
        "Times New Roman",
        "Noto Serif",
        serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: var(--mono);
      font-size: var(--ui-size);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      position: relative;
      width: 100%;
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background: var(--black);
    }

    button,
    a {
      color: inherit;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 0;
      background: none;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 1px solid var(--green-light);
      outline-offset: 5px;
    }

    ::selection {
      color: var(--white);
      background: var(--wine-light);
    }


    /* =====================================================
       02. BACKGROUND LAYERS
       ===================================================== */

    #space,
    #grain,
    .atmosphere,
    .vignette {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #space {
      z-index: 0;
      display: block;
    }

    .atmosphere {
      z-index: 1;
      background:
        radial-gradient(
          ellipse at 52% 46%,
          rgba(25, 36, 28, 0.12) 0%,
          rgba(10, 13, 11, 0.07) 28%,
          transparent 66%
        );
    }

    #grain {
      z-index: 2;
      opacity: 0.075;
      mix-blend-mode: screen;
    }

    .vignette {
      z-index: 3;
      background:
        radial-gradient(
          ellipse at center,
          transparent 32%,
          rgba(0, 0, 0, 0.23) 100%
        );
    }


    /* =====================================================
       03. HEADER
       ===================================================== */

    .site-header {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;

      width: 100%;
      padding: var(--page-padding);

      color: var(--silver);
      font-size: var(--ui-size);
      line-height: 1.7;
      letter-spacing: 0.055em;
    }

    .brand {
      justify-self: start;
      display: flex;
      flex-direction: column;
      gap: 3px;

      color: var(--silver);
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand-name {
      color: var(--white);
      letter-spacing: 0.14em;
    }

    .brand-note {
      color: rgba(180, 180, 185, 0.48);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .main-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(14px, 2.1vw, 32px);

      white-space: nowrap;
    }

    .nav-link {
      position: relative;
      padding: 0;

      color: var(--silver);
      font-size: inherit;
      line-height: inherit;
      letter-spacing: inherit;

      transition:
        color 240ms ease,
        opacity 240ms ease;
    }

    .nav-link::after {
      content: "";

      position: absolute;
      right: 0;
      bottom: -5px;
      left: 0;

      height: 1px;
      background: var(--wine-light);

      transform: scaleX(0);
      transform-origin: left center;

      transition: transform 240ms ease;
    }

    .nav-link:hover,
    .nav-link[aria-expanded="true"] {
      color: var(--white);
    }

    .nav-link:hover::after,
    .nav-link[aria-expanded="true"]::after {
      transform: scaleX(1);
    }

    .language-switch {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .language-button {
      padding: 0;

      color: rgba(180, 180, 185, 0.52);
      font-size: inherit;
      line-height: inherit;

      transition: color 200ms ease;
    }

    .language-button:hover,
    .language-button.active {
      color: var(--white);
    }

    .language-divider {
      color: rgba(180, 180, 185, 0.22);
    }


    /* =====================================================
       04. HOME COMPOSITION
       ===================================================== */

    .home {
      position: relative;
      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100vh;
      height: 100svh;

      min-height: 400px;
      padding: 100px var(--page-padding) 90px;
    }

    .title-composition {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: stretch;

      width: min(460px, 72vw);
      margin: 0 auto;

      transform: translateY(-1vh);
    }

    /*
      IMPORTANT:
      Each word is explicitly a horizontal flex row.
      writing-mode is explicitly horizontal.
      white-space prevents letters from wrapping.
    */

    .title-word {
      display: flex;
      flex-direction: row;
      align-items: center;

      width: max-content;
      max-width: 100%;

      white-space: nowrap;
      writing-mode: horizontal-tb;

      color: var(--green);

      font-family: var(--mono);
      font-size: var(--ui-size);
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.02em;

      text-transform: uppercase;

      text-shadow:
        0 0 5px rgba(65, 108, 73, 0.16);

      will-change: transform;
    }

    .word-one {
      align-self: flex-start;
      margin-left: 24%;
    }

    .word-two {
      align-self: flex-start;
      margin-top: 18px;
      margin-left: 39%;
    }

    .title-letter {
      display: inline-block;
      flex: 0 0 auto;

      white-space: pre;
      writing-mode: horizontal-tb;

      transition:
        color 260ms ease,
        text-shadow 260ms ease,
        transform 360ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .title-letter:hover {
      color: var(--green-light);

      text-shadow:
        0 0 5px rgba(96, 138, 100, 0.4),
        0 0 14px rgba(65, 108, 73, 0.15);
    }

    .title-letter.gap {
      width: 0.36em;
    }

    .word-one .title-letter:nth-child(2) {
      margin-right: 0.07em;
    }

    .word-one .title-letter:nth-child(4) {
      margin-left: 0.05em;
    }

    .word-two .title-letter:nth-child(3) {
      margin-right: 0.06em;
    }

    .word-two .title-letter:nth-child(6) {
      margin-left: 0.05em;
    }

    .title-index {
      position: absolute;
      top: 50%;
      left: 4%;

      color: rgba(133, 133, 139, 0.34);
      font-size: 9px;
      letter-spacing: 0.08em;

      transform: translateY(-50%);
    }

    .title-index::after {
      content: "";
      display: block;

      width: 16px;
      height: 1px;
      margin-top: 8px;

      background: rgba(133, 133, 139, 0.35);
    }

    .composition-mark {
      position: absolute;
      top: -30px;
      right: 9%;

      width: 4px;
      height: 4px;

      border-radius: 50%;
      background: var(--wine-light);

      box-shadow:
        0 0 8px rgba(73, 32, 42, 0.3);
    }


    /* =====================================================
       05. FOOTER
       ===================================================== */

    .site-footer {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      padding: 0 var(--page-padding) 28px;

      color: rgba(133, 133, 139, 0.58);
      font-size: 9px;
      line-height: 1.7;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .footer-left,
    .footer-right {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .footer-right {
      align-items: flex-end;
      text-align: right;
    }

    .footer-accent {
      color: rgba(73, 32, 42, 0.85);
    }


    /* =====================================================
       06. CONTENT PANELS
       ===================================================== */

    .panel-backdrop {
      position: fixed;
      z-index: 29;
      inset: 0;

      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 280ms ease,
        visibility 280ms ease;
    }

    .panel-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .content-panel {
      position: fixed;
      z-index: 30;
      top: 0;
      right: 0;

      width: min(500px, 100%);
      height: 100vh;
      height: 100dvh;

      padding: 105px 42px 40px;

      overflow-y: auto;

      color: var(--white);
      background: rgba(8, 8, 9, 0.96);

      border-left: 1px solid var(--line-soft);

      transform: translateX(102%);

      transition:
        transform 420ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .content-panel.open {
      transform: translateX(0);
    }

    .panel-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;

      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-number {
      color: var(--green);
      font-size: 9px;
      letter-spacing: 0.12em;
    }

    .panel-close {
      color: var(--silver);
      font-size: 10px;
      letter-spacing: 0.08em;

      transition: color 200ms ease;
    }

    .panel-close:hover {
      color: var(--wine-light);
    }

    .panel-title {
      margin: 38px 0 20px;

      color: var(--white);
      font-family: var(--serif);
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .panel-description {
      max-width: 340px;

      color: var(--silver);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.8;
    }

    .panel-rule {
      width: 28px;
      height: 1px;
      margin: 34px 0;

      background: var(--wine-light);
    }

    .panel-note {
      color: rgba(133, 133, 139, 0.7);
      font-size: 9px;
      line-height: 1.9;
      letter-spacing: 0.05em;
    }


    /* =====================================================
       07. RESPONSIVE LAYOUT
       ===================================================== */

    @media (max-width: 900px) {
      :root {
        --page-padding: 22px;
      }

      .site-header {
        grid-template-columns: auto 1fr auto;
      }

      .main-nav {
        gap: 14px;
      }

      .brand-note {
        display: none;
      }

      .title-composition {
        width: min(400px, 80vw);
      }
    }

    @media (max-width: 620px) {
      :root {
        --ui-size: 8px;
        --page-padding: 16px;
      }

      .site-header {
        grid-template-columns: 1fr auto;
        row-gap: 24px;
      }

      .brand {
        grid-column: 1;
        grid-row: 1;
      }

      .language-switch {
        grid-column: 2;
        grid-row: 1;
      }

      .main-nav {
        grid-column: 1 / -1;
        grid-row: 2;

        justify-content: space-between;
        gap: 10px;

        width: 100%;
      }

      .nav-link {
        font-size: var(--ui-size);
        letter-spacing: -0.035em;
      }

      .home {
        padding-top: 120px;
        padding-bottom: 80px;
      }

      .title-composition {
        width: min(330px, 84vw);
      }

      .word-one {
        margin-left: 18%;
      }

      .word-two {
        margin-top: 15px;
        margin-left: 32%;
      }

      .title-index {
        left: 0;
        font-size: 8px;
      }

      .site-footer {
        padding-bottom: 18px;
        font-size: 8px;
      }

      .content-panel {
        padding: 115px 25px 35px;
      }
    }

    @media (max-width: 360px) {
      :root {
        --page-padding: 12px;
      }

      .main-nav {
        gap: 7px;
      }

      .nav-link {
        font-size: 7px;
      }

      .title-composition {
        width: 90vw;
      }

      .word-one {
        margin-left: 15%;
      }

      .word-two {
        margin-left: 28%;
      }
    }


    /* =====================================================
       08. REDUCED MOTION
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <!-- Background: stars and continuous traces -->
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="atmosphere" aria-hidden="true"></div>
  <canvas id="grain" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>


  <!-- Header -->
  <header class="site-header">

    <a class="brand" href="./" aria-label="Return to home">
      <span class="brand-name">A Living Archive</span>
      <span class="brand-note">Personal Index / 001</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">

      <button
        class="nav-link"
        data-section="about"
        aria-expanded="false"
      >
        About me
      </button>

      <button
        class="nav-link"
        data-section="thoughts"
        aria-expanded="false"
      >
        About what I think
      </button>

      <button
        class="nav-link"
        data-section="reading"
        aria-expanded="false"
      >
        About what I read
      </button>

      <button
        class="nav-link"
        data-section="wants"
        aria-expanded="false"
      >
        About what I want
      </button>

    </nav>

    <div class="language-switch" aria-label="Language selection">

      <button class="language-button active" data-lang="en">
        EN
      </button>

      <span class="language-divider">/</span>

      <button class="language-button" data-lang="zh">
        中
      </button>

      <span class="language-divider">/</span>

      <button class="language-button" data-lang="fr">
        FR
      </button>

    </div>

  </header>


  <!-- Main home composition -->
  <main class="home" id="home">

    <div class="title-composition">

      <span class="title-index" aria-hidden="true">01—04</span>
      <span class="composition-mark" aria-hidden="true"></span>

      <div
        class="title-word word-one"
        id="titleStill"
        aria-label="Still"
      >
        <span class="title-letter">S</span>
        <span class="title-letter">T</span>
        <span class="title-letter">I</span>
        <span class="title-letter">L</span>
        <span class="title-letter">L</span>
      </div>

      <div
        class="title-word word-two"
        id="titleBecoming"
        aria-label="Becoming"
      >
        <span class="title-letter">B</span>
        <span class="title-letter">E</span>
        <span class="title-letter">C</span>
        <span class="title-letter">O</span>
        <span class="title-letter">M</span>
        <span class="title-letter">I</span>
        <span class="title-letter">N</span>
        <span class="title-letter">G</span>
      </div>

    </div>

  </main>


  <!-- Footer -->
  <footer class="site-footer">

    <div class="footer-left">
      <span data-i18n="footerOne">AN ONGOING PROCESS</span>
      <span class="footer-accent" data-i18n="footerTwo">
        NOTHING IS FINISHED
      </span>
    </div>

    <div class="footer-right">
      <span>SHENZHEN — EVERYWHERE</span>
      <span id="yearLabel">© 2026</span>
    </div>

  </footer>


  <!-- Panel backdrop -->
  <div class="panel-backdrop" id="panelBackdrop"></div>


  <!-- Independent content panel -->
  <aside
    class="content-panel"
    id="contentPanel"
    aria-hidden="true"
    aria-labelledby="panelTitle"
  >

    <div class="panel-topline">

      <span class="panel-number" id="panelNumber">
        INDEX / 01
      </span>

      <button class="panel-close" id="panelClose">
        CLOSE ×
      </button>

    </div>

    <h1 class="panel-title" id="panelTitle">
      About me
    </h1>

    <p class="panel-description" id="panelDescription">
      A person is never a finished portrait.
      This is a place to collect the fragments
      that make up a life.
    </p>

    <div class="panel-rule"></div>

    <p class="panel-note" id="panelNote">
      THIS SPACE IS STILL TAKING SHAPE.
    </p>

  </aside>


  <script>
    /* =====================================================
       01. LANGUAGE CONTENT
       ===================================================== */

    const translations = {
      en: {
        nav: [
          "About me",
          "About what I think",
          "About what I read",
          "About what I want"
        ],

        footerOne: "AN ONGOING PROCESS",
        footerTwo: "NOTHING IS FINISHED",

        close: "CLOSE ×",

        sections: {
          about: {
            number: "INDEX / 01",
            title: "About me",
            description:
              "A person is never a finished portrait. This is a place to collect the fragments that make up a life.",
            note: "IDENTITY IS ALWAYS IN PROGRESS."
          },

          thoughts: {
            number: "INDEX / 02",
            title: "About what I think",
            description:
              "Notes from an unfinished mind. Thoughts, questions and observations that may change as I do.",
            note: "IDEAS ARE ALLOWED TO CHANGE."
          },

          reading: {
            number: "INDEX / 03",
            title: "About what I read",
            description:
              "Books, essays, quotations and other things that stay with me long after I close the page.",
            note: "A RECORD OF WHAT REMAINS."
          },

          wants: {
            number: "INDEX / 04",
            title: "About what I want",
            description:
              "Desires, directions and possible futures. Not a fixed destination, but a map that keeps being redrawn.",
            note: "THE FUTURE IS NOT A FINAL DRAFT."
          }
        }
      },

      zh: {
        nav: [
          "关于我",
          "关于思考",
          "关于阅读",
          "关于想要"
        ],

        footerOne: "一个持续进行的过程",
        footerTwo: "一切尚未完成",

        close: "关闭 ×",

        sections: {
          about: {
            number: "索引 / 01",
            title: "关于我",
            description:
              "一个人从来不是一幅已经完成的肖像。这里收集构成我的生活碎片、经历与变化。",
            note: "关于自我的探索，仍在继续。"
          },

          thoughts: {
            number: "索引 / 02",
            title: "关于思考",
            description:
              "记录尚未定型的想法、问题与观察。它们可以随着时间改变，也可以彼此矛盾。",
            note: "想法可以改变。"
          },

          reading: {
            number: "索引 / 03",
            title: "关于阅读",
            description:
              "书籍、文章、摘录，以及那些合上书页之后，仍然留在脑海里的东西。",
            note: "记录那些留下来的内容。"
          },

          wants: {
            number: "索引 / 04",
            title: "关于想要",
            description:
              "愿望、方向与尚未发生的未来。这里不是一张固定的终点清单，而是一幅不断重绘的地图。",
            note: "未来不是一份最终定稿。"
          }
        }
      },

      fr: {
        nav: [
          "À propos de moi",
          "Mes pensées",
          "Mes lectures",
          "Mes envies"
        ],

        footerOne: "UN PROCESSUS CONTINU",
        footerTwo: "RIEN N'EST ACHEVÉ",

        close: "FERMER ×",

        sections: {
          about: {
            number: "INDEX / 01",
            title: "À propos de moi",
            description:
              "Une personne n'est jamais un portrait achevé. Cet espace rassemble les fragments qui composent une vie.",
            note: "L'IDENTITÉ EST EN MOUVEMENT."
          },

          thoughts: {
            number: "INDEX / 02",
            title: "Mes pensées",
            description:
              "Des notes issues d'un esprit en devenir : pensées, questions et observations susceptibles d'évoluer.",
            note: "LES IDÉES PEUVENT CHANGER."
          },

          reading: {
            number: "INDEX / 03",
            title: "Mes lectures",
            description:
              "Des livres, des textes et des citations qui continuent de résonner après la dernière page.",
            note: "UNE TRACE DE CE QUI RESTE."
          },

          wants: {
            number: "INDEX / 04",
            title: "Mes envies",
            description:
              "Des désirs, des directions et des futurs possibles. Non pas une destination fixe, mais une carte à redessiner.",
            note: "LE FUTUR N'EST PAS UNE VERSION FINALE."
          }
        }
      }
    };


    /* =====================================================
       02. LANGUAGE SWITCHING
       ===================================================== */

    let currentLanguage = "en";
    let activeSection = null;

    const navButtons = document.querySelectorAll(".nav-link");
    const languageButtons = document.querySelectorAll(".language-button");

    const panel = document.getElementById("contentPanel");
    const panelBackdrop = document.getElementById("panelBackdrop");

    const panelNumber = document.getElementById("panelNumber");
    const panelTitle = document.getElementById("panelTitle");
    const panelDescription = document.getElementById("panelDescription");
    const panelNote = document.getElementById("panelNote");
    const panelClose = document.getElementById("panelClose");


    function setLanguage(language) {
      if (!translations[language]) return;

      currentLanguage = language;

      document.documentElement.lang =
        language === "zh" ? "zh-CN" : language;

      languageButtons.forEach(button => {
        const isActive = button.dataset.lang === language;

        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });

      navButtons.forEach((button, index) => {
        button.textContent = translations[language].nav[index];
      });

      document.querySelector('[data-i18n="footerOne"]').textContent =
        translations[language].footerOne;

      document.querySelector('[data-i18n="footerTwo"]').textContent =
        translations[language].footerTwo;

      panelClose.textContent = translations[language].close;

      if (activeSection) {
        renderPanel(activeSection);
      }
    }


    languageButtons.forEach(button => {
      button.addEventListener("click", () => {
        setLanguage(button.dataset.lang);
      });
    });


    /* =====================================================
       03. NAVIGATION PANELS
       ===================================================== */

    function renderPanel(sectionKey) {
      const section =
        translations[currentLanguage].sections[sectionKey];

      if (!section) return;

      panelNumber.textContent = section.number;
      panelTitle.textContent = section.title;
      panelDescription.textContent = section.description;
      panelNote.textContent = section.note;
    }


    function openPanel(sectionKey) {
      activeSection = sectionKey;

      renderPanel(sectionKey);

      panel.classList.add("open");
      panelBackdrop.classList.add("open");

      panel.setAttribute("aria-hidden", "false");

      navButtons.forEach(button => {
        const active = button.dataset.section === sectionKey;

        button.setAttribute("aria-expanded", String(active));
      });

      document.body.style.overflow = "hidden";
    }


    function closePanel() {
      activeSection = null;

      panel.classList.remove("open");
      panelBackdrop.classList.remove("open");

      panel.setAttribute("aria-hidden", "true");

      navButtons.forEach(button => {
        button.setAttribute("aria-expanded", "false");
      });

      document.body.style.overflow = "";
    }


    navButtons.forEach(button => {
      button.addEventListener("click", () => {
        const sectionKey = button.dataset.section;

        if (activeSection === sectionKey) {
          closePanel();
        } else {
          openPanel(sectionKey);
        }
      });
    });


    panelClose.addEventListener("click", closePanel);
    panelBackdrop.addEventListener("click", closePanel);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closePanel();
      }
    });


    /* =====================================================
       04. SUBTLE LETTER INTERACTION
       ===================================================== */

    const titleLetters =
      document.querySelectorAll(".title-letter");

    const prefersReducedMotion =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (!prefersReducedMotion && window.matchMedia("(hover: hover)").matches) {
      titleLetters.forEach((letter, index) => {
        letter.addEventListener("pointermove", event => {
          const rect = letter.getBoundingClientRect();

          const x =
            (event.clientX - rect.left) / rect.width - 0.5;

          const y =
            (event.clientY - rect.top) / rect.height - 0.5;

          letter.style.transform =
            `translate(${x * 3}px, ${y * 2}px)`;
        });

        letter.addEventListener("pointerleave", () => {
          letter.style.transform = "";
        });
      });
    }


    /* =====================================================
       05. COSMIC BACKGROUND
       Sparse continuous lines and restrained light points.
       ===================================================== */

    const spaceCanvas = document.getElementById("space");
    const spaceContext = spaceCanvas.getContext("2d");

    let width = 0;
    let height = 0;
    let pixelRatio = 1;

    let stars = [];
    let paths = [];

    let pointerX = 0;
    let pointerY = 0;

    let targetPointerX = 0;
    let targetPointerY = 0;


    function seededRandom(seed) {
      let value = seed >>> 0;

      return function () {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }


    function resizeSpace() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      spaceCanvas.width = Math.round(width * pixelRatio);
      spaceCanvas.height = Math.round(height * pixelRatio);

      spaceCanvas.style.width = width + "px";
      spaceCanvas.style.height = height + "px";

      spaceContext.setTransform(
        pixelRatio, 0, 0, pixelRatio, 0, 0
      );

      createSpace();
      drawSpace();
    }


    function createSpace() {
      const random = seededRandom(20261105);

      stars = [];
      paths = [];

      const starCount = Math.min(
        85,
        Math.max(35, Math.floor(width * height / 16000))
      );

      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: random() * width,
          y: random() * height,
          r: random() * 0.8 + 0.2,
          alpha: random() * 0.32 + 0.08
        });
      }

      /*
        A small number of continuous trajectories.
        These are curves, not dotted or dashed lines.
      */

      const pathCount = width < 620 ? 5 : 8;

      for (let i = 0; i < pathCount; i++) {
        const startX = random() * width;
        const startY = random() * height;

        const reach = width * (0.16 + random() * 0.28);
        const rise = height * (0.06 + random() * 0.14);

        paths.push({
          x1: startX,
          y1: startY,

          c1x: startX + reach * 0.25,
          c1y: startY - rise,

          c2x: startX + reach * 0.65,
          c2y: startY + rise * 0.3,

          x2: startX + reach,
          y2: startY + rise * 0.55,

          alpha: 0.045 + random() * 0.055
        });
      }
    }


    function drawSpace() {
      spaceContext.clearRect(0, 0, width, height);

      const shiftX = pointerX * 5;
      const shiftY = pointerY * 4;

      /*
        Continuous silver-white trajectories.
      */

      paths.forEach(path => {
        spaceContext.beginPath();

        spaceContext.moveTo(
          path.x1 + shiftX,
          path.y1 + shiftY
        );

        spaceContext.bezierCurveTo(
          path.c1x + shiftX,
          path.c1y + shiftY,
          path.c2x + shiftX,
          path.c2y + shiftY,
          path.x2 + shiftX,
          path.y2 + shiftY
        );

        spaceContext.strokeStyle =
          `rgba(190, 198, 200, ${path.alpha})`;

        spaceContext.lineWidth = 0.65;
        spaceContext.stroke();
      });


      /*
        Sparse, subtle points.
      */

      stars.forEach(star => {
        spaceContext.beginPath();

        spaceContext.arc(
          star.x + shiftX * 0.3,
          star.y + shiftY * 0.3,
          star.r,
          0,
          Math.PI * 2
        );

        spaceContext.fillStyle =
          `rgba(220, 224, 224, ${star.alpha})`;

        spaceContext.fill();
      });


      /*
        A few understated reference points.
      */

      if (width > 600) {
        const marks = [
          [width * 0.19, height * 0.31],
          [width * 0.78, height * 0.68],
          [width * 0.68, height * 0.24]
        ];

        marks.forEach((point, index) => {
          spaceContext.beginPath();

          spaceContext.arc(
            point[0],
            point[1],
            index === 1 ? 1.3 : 0.8,
            0,
            Math.PI * 2
          );

          spaceContext.fillStyle =
            index === 1
              ? "rgba(73, 32, 42, 0.65)"
              : "rgba(180, 190, 190, 0.32)";

          spaceContext.fill();
        });
      }
    }


    window.addEventListener("pointermove", event => {
      if (prefersReducedMotion) return;

      targetPointerX =
        (event.clientX / window.innerWidth - 0.5) * 2;

      targetPointerY =
        (event.clientY / window.innerHeight - 0.5) * 2;
    });


    function animateSpace() {
      if (!prefersReducedMotion) {
        pointerX += (targetPointerX - pointerX) * 0.025;
        pointerY += (targetPointerY - pointerY) * 0.025;

        drawSpace();
        requestAnimationFrame(animateSpace);
      }
    }


    window.addEventListener("resize", resizeSpace);

    resizeSpace();

    if (!prefersReducedMotion) {
      requestAnimationFrame(animateSpace);
    }


    /* =====================================================
       06. SOFT FILM GRAIN
       Grain is separate from the continuous background lines.
       ===================================================== */

    const grainCanvas = document.getElementById("grain");
    const grainContext = grainCanvas.getContext("2d");

    let grainTimer = null;


    function resizeGrain() {
      const grainScale = 0.35;

      grainCanvas.width = Math.max(
        1,
        Math.floor(window.innerWidth * grainScale)
      );

      grainCanvas.height = Math.max(
        1,
        Math.floor(window.innerHeight * grainScale)
      );

      grainCanvas.style.width = "100%";
      grainCanvas.style.height = "100%";

      drawGrain();
    }


    function drawGrain() {
      const imageData = grainContext.createImageData(
        grainCanvas.width,
        grainCanvas.height
      );

      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        const value = Math.random() * 255;

        data[i] = value;
        data[i + 1] = value;
        data[i + 2] = value;

        /*
          Very low alpha creates a soft texture,
          not visible dots or dashed lines.
        */

        data[i + 3] = Math.random() * 18;
      }

      grainContext.putImageData(imageData, 0, 0);
    }


    function startGrain() {
      if (grainTimer) {
        clearInterval(grainTimer);
      }

      if (!prefersReducedMotion) {
        grainTimer = setInterval(drawGrain, 220);
      }
    }


    window.addEventListener("resize", resizeGrain);

    resizeGrain();
    startGrain();


    /* =====================================================
       07. INITIALIZATION
       ===================================================== */

    document.getElementById("yearLabel").textContent =
      "© " + new Date().getFullYear();

    setLanguage("en");

  </script>

</body>
</html>
