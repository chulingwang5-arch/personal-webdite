<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050506">

<title>Still Becoming — Personal Archive</title>

<style>
:root {
    --black: #050506;
    --white: #e8e8e5;
    --silver: #85858b;
    --green: #416c49;
    --green-light: #608a64;
    --wine: #35151e;
    --wine-light: #49202a;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--black);
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
}

button, a {
    font: inherit;
}

button {
    color: inherit;
}

#space,
#grain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#space {
    z-index: 0;
}

#grain {
    z-index: 1;
    opacity: 0.13;
}

.atmosphere {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at 50% 48%,
            transparent 20%,
            rgba(5, 5, 6, 0.35) 70%,
            rgba(5, 5, 6, 0.85) 100%
        ),
        radial-gradient(
            ellipse at 75% 80%,
            rgba(53, 21, 30, 0.18),
            transparent 40%
        );
}

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 30px 4.5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.brand {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.brand-name {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
}

.brand-index {
    font-size: 8px;
    letter-spacing: 0.16em;
    color: var(--silver);
}

.header-right {
    display: flex;
    align-items: center;
    gap: 38px;
}

nav {
    display: flex;
    align-items: center;
    gap: 28px;
}

.nav-button {
    position: relative;
    padding: 8px 0;
    border: none;
    background: transparent;
    color: var(--silver);
    cursor: pointer;
    font-size: 10px;
    letter-spacing: 0.1em;
    transition: color 0.3s ease;
}

.nav-button::after {
    content: "";
    position: absolute;
    bottom: 2px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--green-light);
    transition: width 0.3s ease;
}

.nav-button:hover,
.nav-button.active {
    color: var(--white);
}

.nav-button:hover::after,
.nav-button.active::after {
    width: 100%;
}

.language-switch {
    display: flex;
    gap: 10px;
}

.language-button {
    border: none;
    background: transparent;
    color: #66666b;
    cursor: pointer;
    font-size: 9px;
    letter-spacing: 0.08em;
}

.language-button.active,
.language-button:hover {
    color: var(--white);
}

main {
    position: relative;
    z-index: 3;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.hero {
    position: relative;
    width: min(760px, 85vw);
    transform: translateY(-2%);
}

.hero-line {
    display: flex;
    align-items: center;
    font-size: clamp(48px, 9vw, 104px);
    line-height: 0.95;
    font-weight: 400;
    letter-spacing: -0.075em;
    color: var(--green);
    text-transform: uppercase;
    user-select: none;
}

.hero-line:first-child {
    padding-left: 2%;
}

.hero-line:last-child {
    justify-content: flex-end;
    padding-right: 1%;
    margin-top: 12px;
}

.hero-line span {
    display: inline-block;
    transition:
        transform 0.4s ease,
        color 0.4s ease,
        text-shadow 0.4s ease;
}

.hero-line span:hover {
    color: var(--green-light);
    transform: translateY(-7px);
    text-shadow: 0 0 22px rgba(96, 138, 100, 0.4);
}

.hero-caption {
    display: flex;
    justify-content: space-between;
    margin-top: 35px;
    padding: 0 2%;
    color: var(--silver);
    font-size: 8px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
}

footer {
    position: fixed;
    bottom: 28px;
    left: 4.5%;
    right: 4.5%;
    display: flex;
    justify-content: space-between;
    color: var(--silver);
    font-size: 8px;
    letter-spacing: 0.16em;
    z-index: 5;
}

.panel-backdrop {
    position: fixed;
    inset: 0;
    z-index: 19;
    background: rgba(0, 0, 0, 0.35);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
}

.panel-backdrop.open {
    opacity: 1;
    visibility: visible;
}

.content-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: min(480px, 90vw);
    height: 100%;
    padding: 13vh 7% 8%;
    z-index: 20;

    background: rgba(9, 9, 11, 0.96);
    border-left: 1px solid rgba(133, 133, 139, 0.18);

    transform: translateX(100%);
    transition: transform 0.55s cubic-bezier(0.7, 0, 0.2, 1);
    backdrop-filter: blur(18px);
}

.content-panel.open {
    transform: translateX(0);
}

.panel-close {
    position: absolute;
    top: 32px;
    right: 35px;
    border: none;
    background: transparent;
    color: var(--silver);
    cursor: pointer;
    font-size: 20px;
    font-weight: 200;
    transition: color 0.3s ease;
}

.panel-close:hover {
    color: var(--white);
}

.panel-index {
    color: var(--green-light);
    font-size: 9px;
    letter-spacing: 0.2em;
    margin-bottom: 30px;
}

.panel-title {
    font-size: clamp(28px, 4vw, 42px);
    line-height: 1.15;
    font-weight: 400;
    letter-spacing: -0.04em;
    margin-bottom: 28px;
}

.panel-description {
    color: #aaa9aa;
    font-size: 13px;
    line-height: 1.9;
    font-weight: 300;
}

.panel-rule {
    width: 42px;
    height: 1px;
    margin: 35px 0;
    background: var(--wine-light);
}

.panel-note {
    color: var(--silver);
    font-size: 10px;
    line-height: 1.8;
    letter-spacing: 0.04em;
}

/* ENTER / EXPLORE */

.panel-explore {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 38px;
    padding: 12px 0;

    color: var(--green-light);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-decoration: none;
    text-transform: uppercase;

    border-bottom: 1px solid rgba(96, 138, 100, 0.5);

    transition:
        color 0.3s ease,
        border-color 0.3s ease,
        letter-spacing 0.3s ease;
}

.panel-explore:hover {
    color: var(--white);
    border-color: var(--white);
    letter-spacing: 0.25em;
}

@media (max-width: 760px) {
    header {
        padding: 24px 6%;
        align-items: flex-start;
    }

    .header-right {
        gap: 18px;
        flex-direction: column;
        align-items: flex-end;
    }

    nav {
        gap: 13px;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: 250px;
    }

    .nav-button {
        font-size: 8px;
    }

    .language-switch {
        gap: 9px;
    }

    .hero {
        width: 88vw;
    }

    .hero-line {
        font-size: clamp(44px, 12vw, 78px);
    }

    .hero-caption {
        font-size: 7px;
    }

    footer {
        font-size: 7px;
        bottom: 20px;
    }

    .content-panel {
        width: 88vw;
        padding: 14vh 8% 8%;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<canvas id="space"></canvas>
<canvas id="grain"></canvas>
<div class="atmosphere"></div>

<header>
    <div class="brand">
        <div class="brand-name">A Living Archive</div>
        <div class="brand-index">Personal Index 001</div>
    </div>

    <div class="header-right">
        <nav>
            <button class="nav-button" data-section="about">About me</button>
            <button class="nav-button" data-section="thoughts">About what I think</button>
            <button class="nav-button" data-section="reading">About what I read</button>
            <button class="nav-button" data-section="wants">About what I want</button>
        </nav>

        <div class="language-switch">
            <button class="language-button active" data-lang="en">EN</button>
            <button class="language-button" data-lang="zh">中</button>
            <button class="language-button" data-lang="fr">FR</button>
        </div>
    </div>
</header>

<main>
    <div class="hero">
        <div class="hero-line" id="still"></div>
        <div class="hero-line" id="becoming"></div>

        <div class="hero-caption">
            <span>Personal Archive</span>
            <span>In Progress — <span id="year"></span></span>
        </div>
    </div>
</main>

<footer>
    <span>DESIGN · THOUGHT · MEMORY</span>
    <span>STILL BECOMING</span>
</footer>

<div class="panel-backdrop" id="panelBackdrop"></div>

<aside class="content-panel" id="contentPanel" aria-hidden="true">
    <button class="panel-close" id="panelClose" aria-label="Close">×</button>

    <div class="panel-index" id="panelIndex">INDEX 001</div>

    <h1 class="panel-title" id="panelTitle"></h1>

    <p class="panel-description" id="panelDescription"></p>

    <div class="panel-rule"></div>

    <p class="panel-note" id="panelNote"></p>

    <a class="panel-explore" id="panelExplore" href="#">
        ENTER / EXPLORE ↗
    </a>
</aside>

<script>
/* --------------------------------
   LANGUAGE CONTENT
-------------------------------- */

const translations = {
    en: {
        nav: [
            "About me",
            "About what I think",
            "About what I read",
            "About what I want"
        ],
        explore: "ENTER / EXPLORE ↗",
        sections: {
            about: {
                index: "INDEX 001 / ABOUT ME",
                title: "About me",
                description:
                    "A collection of experiences, identities and fragments that have shaped who I am.",
                note: "An ongoing record of becoming."
            },
            thoughts: {
                index: "INDEX 002 / THOUGHTS",
                title: "About what I think",
                description:
                    "Notes on design, culture, everyday observations and ideas that continue to evolve.",
                note: "Thoughts are never truly finished."
            },
            reading: {
                index: "INDEX 003 / READING",
                title: "About what I read",
                description:
                    "Books, images, references and visual materials that inspire my thinking and creative practice.",
                note: "A personal library of references."
            },
            wants: {
                index: "INDEX 004 / WANTS",
                title: "About what I want",
                description:
                    "A space for future plans, personal projects, experiments and things I want to explore.",
                note: "Collecting possibilities, one by one."
            }
        }
    },

    zh: {
        nav: [
            "关于我",
            "关于我的思考",
            "关于我的阅读",
            "关于我的愿望"
        ],
        explore: "进入栏目 ↗",
        sections: {
            about: {
                index: "索引 001 / 关于我",
                title: "关于我",
                description:
                    "记录塑造我的经历、身份，以及那些不断构成自我的细碎片段。",
                note: "一份持续生长中的个人记录。"
            },
            thoughts: {
                index: "索引 002 / 思考",
                title: "关于我的思考",
                description:
                    "关于设计、文化、日常观察，以及那些仍在不断变化和发展的想法。",
                note: "思考并不总是有最终答案。"
            },
            reading: {
                index: "索引 003 / 阅读",
                title: "关于我的阅读",
                description:
                    "收集书籍、图像、参考资料，以及启发我思考和创作的视觉材料。",
                note: "一座持续扩充的私人资料库。"
            },
            wants: {
                index: "索引 004 / 愿望",
                title: "关于我的愿望",
                description:
                    "关于未来计划、个人项目、实验，以及所有我希望继续探索的事情。",
                note: "一点一点，收集未来的可能性。"
            }
        }
    },

    fr: {
        nav: [
            "À propos de moi",
            "Mes réflexions",
            "Mes lectures",
            "Mes envies"
        ],
        explore: "EXPLORER ↗",
        sections: {
            about: {
                index: "INDEX 001 / À PROPOS",
                title: "À propos de moi",
                description:
                    "Une collection d'expériences, d'identités et de fragments qui ont façonné qui je suis.",
                note: "Une histoire personnelle en devenir."
            },
            thoughts: {
                index: "INDEX 002 / RÉFLEXIONS",
                title: "Mes réflexions",
                description:
                    "Des notes sur le design, la culture, les observations quotidiennes et les idées en évolution.",
                note: "Les pensées ne sont jamais vraiment terminées."
            },
            reading: {
                index: "INDEX 003 / LECTURES",
                title: "Mes lectures",
                description:
                    "Des livres, des images et des références qui nourrissent ma réflexion et ma pratique créative.",
                note: "Une bibliothèque personnelle de références."
            },
            wants: {
                index: "INDEX 004 / ENVIES",
                title: "Mes envies",
                description:
                    "Un espace dédié aux projets futurs, aux expériences et aux choses que je souhaite explorer.",
                note: "Collectionner les possibilités, une à une."
            }
        }
    }
};

const sectionLinks = {
    about: "about-me/index.html",
    thoughts: "thoughts/index.html",
    reading: "reading/index.html",
    wants: "wants/index.html"
};

let currentLanguage = "en";
let activeSection = null;


/* --------------------------------
   HERO TITLE
-------------------------------- */

function createLetters(elementId, text) {
    const element = document.getElementById(elementId);
    element.innerHTML = "";

    [...text].forEach((letter, index) => {
        const span = document.createElement("span");
        span.textContent = letter === " " ? "\u00A0" : letter;
        span.style.transitionDelay = `${index * 12}ms`;
        element.appendChild(span);
    });
}

createLetters("still", "STILL");
createLetters("becoming", "BECOMING");


/* --------------------------------
   LANGUAGE SWITCHING
-------------------------------- */

function setLanguage(language) {
    currentLanguage = language;

    document.documentElement.lang =
        language === "zh" ? "zh-CN" :
        language === "fr" ? "fr" : "en";

    document.querySelectorAll(".language-button").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.lang === language
        );
    });

    document.querySelectorAll(".nav-button").forEach((button, index) => {
        button.textContent = translations[language].nav[index];
    });

    if (activeSection) {
        renderPanel(activeSection);
    }
}

document.querySelectorAll(".language-button").forEach(button => {
    button.addEventListener("click", () => {
        setLanguage(button.dataset.lang);
    });
});


/* --------------------------------
   SIDE PANEL
-------------------------------- */

const panel = document.getElementById("contentPanel");
const backdrop = document.getElementById("panelBackdrop");
const panelExplore = document.getElementById("panelExplore");

function renderPanel(sectionKey) {
    const content = translations[currentLanguage].sections[sectionKey];

    if (!content) return;

    document.getElementById("panelIndex").textContent = content.index;
    document.getElementById("panelTitle").textContent = content.title;
    document.getElementById("panelDescription").textContent = content.description;
    document.getElementById("panelNote").textContent = content.note;

    panelExplore.textContent = translations[currentLanguage].explore;
    panelExplore.href = sectionLinks[sectionKey] || "#";
}

function openPanel(sectionKey) {
    activeSection = sectionKey;

    renderPanel(sectionKey);

    panel.classList.add("open");
    backdrop.classList.add("open");
    panel.setAttribute("aria-hidden", "false");

    document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.section === sectionKey
        );
    });
}

function closePanel() {
    activeSection = null;

    panel.classList.remove("open");
    backdrop.classList.remove("open");
    panel.setAttribute("aria-hidden", "true");

    document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.remove("active");
    });
}

document.querySelectorAll(".nav-button").forEach(button => {
    button.addEventListener("click", () => {
        openPanel(button.dataset.section);
    });
});

document.getElementById("panelClose").addEventListener("click", closePanel);
backdrop.addEventListener("click", closePanel);

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closePanel();
    }
});


/* --------------------------------
   COSMIC BACKGROUND
-------------------------------- */

const spaceCanvas = document.getElementById("space");
const spaceCtx = spaceCanvas.getContext("2d");

let width;
let height;
let stars = [];
let curves = [];

function resizeCanvas() {
    width = spaceCanvas.width = window.innerWidth * devicePixelRatio;
    height = spaceCanvas.height = window.innerHeight * devicePixelRatio;

    spaceCanvas.style.width = window.innerWidth + "px";
    spaceCanvas.style.height = window.innerHeight + "px";

    spaceCtx.setTransform(
        devicePixelRatio, 0, 0, devicePixelRatio, 0, 0
    );

    width = window.innerWidth;
    height = window.innerHeight;

    createStars();
    createCurves();
}

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function createStars() {
    stars = [];

    const count = Math.min(
        110,
        Math.floor(window.innerWidth * window.innerHeight / 10000)
    );

    for (let i = 0; i < count; i++) {
        stars.push({
            x: random(0, width),
            y: random(0, height),
            radius: random(0.3, 1.1),
            alpha: random(0.15, 0.6),
            phase: random(0, Math.PI * 2)
        });
    }
}

function createCurves() {
    curves = [];

    for (let i = 0; i < 7; i++) {
        curves.push({
            x: random(-width * 0.2, width * 0.8),
            y: random(-height * 0.2, height * 0.8),
            length: random(width * 0.4, width * 1.2),
            height: random(height * 0.12, height * 0.55),
            alpha: random(0.025, 0.09),
            speed: random(0.00005, 0.00015),
            phase: random(0, Math.PI * 2)
        });
    }
}

let animationTime = 0;

function drawSpace() {
    spaceCtx.clearRect(0, 0, width, height);

    animationTime += 1;

    stars.forEach(star => {
        const pulse =
            0.65 + Math.sin(animationTime * 0.015 + star.phase) * 0.35;

        spaceCtx.beginPath();
        spaceCtx.arc(
            star.x,
            star.y,
            star.radius,
            0,
            Math.PI * 2
        );

        spaceCtx.fillStyle =
            `rgba(220, 220, 225, ${star.alpha * pulse})`;

        spaceCtx.fill();
    });

    curves.forEach((curve, index) => {
        const movement =
            Math.sin(animationTime * curve.speed + curve.phase) * 15;

        spaceCtx.beginPath();

        spaceCtx.moveTo(
            curve.x,
            curve.y + movement
        );

        spaceCtx.bezierCurveTo(
            curve.x + curve.length * 0.3,
            curve.y - curve.height + movement,
            curve.x + curve.length * 0.7,
            curve.y + curve.height + movement,
            curve.x + curve.length,
            curve.y + movement
        );

        spaceCtx.strokeStyle =
            `rgba(190, 190, 200, ${curve.alpha})`;

        spaceCtx.lineWidth = 0.7;
        spaceCtx.stroke();
    });

    requestAnimationFrame(drawSpace);
}


/* --------------------------------
   FILM GRAIN
-------------------------------- */

const grainCanvas = document.getElementById("grain");
const grainCtx = grainCanvas.getContext("2d");

function drawGrain() {
    const w = grainCanvas.width = window.innerWidth;
    const h = grainCanvas.height = window.innerHeight;

    grainCanvas.style.width = w + "px";
    grainCanvas.style.height = h + "px";

    const imageData = grainCtx.createImageData(w, h);

    for (let i = 0; i < imageData.data.length; i += 4) {
        const noise = Math.random() * 255;

        imageData.data[i] = noise;
        imageData.data[i + 1] = noise;
        imageData.data[i + 2] = noise;
        imageData.data[i + 3] = 18;
    }

    grainCtx.putImageData(imageData, 0, 0);
}

setInterval(drawGrain, 120);


/* --------------------------------
   INITIALIZATION
-------------------------------- */

window.addEventListener("resize", resizeCanvas);

resizeCanvas();
drawSpace();
setLanguage("en");

document.getElementById("year").textContent =
    new Date().getFullYear();

</script>

</body>
</html>
