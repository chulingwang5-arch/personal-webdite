<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050506">

<title>STILL BECOMING — A Living Archive</title>

<style>

:root {

  --black: #050506;

  --white: #ededeb;

  --silver: #92929a;

  --dim: #575760;

  --wine: #a42f4d;

  --green: #79ff98;

  --green-light: #c9ffd7;

  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;

  --serif: "Bodoni 72", Didot, "Times New Roman", serif;

  /* Golden-ratio layout references */

  --phi: 1.61803398875;

  --golden-major: 61.8034%;

  --golden-minor: 38.1966%;

}

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}

html,

body {

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: var(--black);

  color: var(--white);

  font-family: var(--sans);

  -webkit-font-smoothing: antialiased;

}

body {

  position: relative;

}

button,

a {

  font: inherit;

  color: inherit;

}

button {

  border: 0;

  background: none;

}

a {

  text-decoration: none;

}

button:focus-visible,

a:focus-visible {

  outline: 1px solid var(--wine);

  outline-offset: 5px;

}

::selection {

  background: var(--wine);

  color: white;

}

/* =========================================

   BACKGROUND LAYERS

========================================= */

#spaceCanvas,

#grainCanvas {

  position: fixed;

  inset: 0;

  width: 100%;

  height: 100%;

  pointer-events: none;

}

#spaceCanvas {

  z-index: 0;

}

#grainCanvas {

  z-index: 3;

  opacity: 0.15;

  mix-blend-mode: screen;

}

.ambient {

  position: fixed;

  inset: 0;

  z-index: 1;

  pointer-events: none;

  background:

    radial-gradient(

      ellipse at 50% 49%,

      rgba(38, 38, 45, 0.15),

      transparent 56%

    ),

    radial-gradient(

      ellipse at 18% 72%,

      rgba(88, 25, 43, 0.07),

      transparent 35%

    ),

    radial-gradient(

      ellipse at 87% 23%,

      rgba(88, 25, 43, 0.045),

      transparent 34%

    );

}

.ambient::after {

  content: "";

  position: absolute;

  inset: 0;

  background:

    linear-gradient(

      90deg,

      transparent 0%,

      rgba(255, 255, 255, 0.012) 49.95%,

      rgba(255, 255, 255, 0.012) 50.05%,

      transparent 100%

    );

}

/* =========================================

   HEADER

========================================= */

.header {

  position: fixed;

  z-index: 20;

  top: 0;

  left: 0;

  width: 100%;

  min-height: 82px;

  padding: 0 clamp(22px, 4.2vw, 66px);

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 25px;

  border-bottom: 1px solid rgba(230, 230, 238, 0.12);

  background: rgba(5, 5, 6, 0.72);

  backdrop-filter: blur(18px);

  -webkit-backdrop-filter: blur(18px);

}

.brand {

  display: flex;

  align-items: center;

  gap: 12px;

  flex-shrink: 0;

}

.brand-symbol {

  position: relative;

  width: 8px;

  height: 8px;

  border-radius: 50%;

  background: var(--wine);

  box-shadow: 0 0 13px rgba(164, 47, 77, 0.45);

}

.brand-symbol::before {

  content: "";

  position: absolute;

  inset: -5px;

  border: 1px solid rgba(164, 47, 77, 0.55);

  border-radius: 50%;

}

.brand-name {

  color: #d3d3d6;

  font-size: 10px;

  font-weight: 400;

  letter-spacing: 0.15em;

  text-transform: uppercase;

  white-space: nowrap;

}

.header-right {

  display: flex;

  align-items: center;

  justify-content: flex-end;

  gap: clamp(20px, 3.5vw, 52px);

}

.nav {

  display: flex;

  align-items: center;

  gap: clamp(15px, 2.5vw, 36px);

}

.nav-link {

  position: relative;

  padding: 12px 0;

  color: #85858d;

  font-size: 9px;

  letter-spacing: 0.08em;

  white-space: nowrap;

  transition: color 0.3s ease;

}

.nav-link::after {

  content: "";

  position: absolute;

  bottom: 5px;

  left: 0;

  width: 100%;

  height: 1px;

  background: var(--wine);

  transform: scaleX(0);

  transform-origin: right;

  transition: transform 0.35s ease;

}

.nav-link:hover,

.nav-link.active {

  color: var(--white);

}

.nav-link:hover::after,

.nav-link.active::after {

  transform: scaleX(1);

  transform-origin: left;

}

.languages {

  display: flex;

  align-items: center;

  gap: 9px;

  flex-shrink: 0;

}

.language {

  cursor: pointer;

  color: #66666e;

  font-size: 10px;

  transition: color 0.25s ease;

}

.language + .language::before {

  content: "/";

  margin-right: 9px;

  color: #36363c;

}

.language:hover,

.language.active {

  color: var(--wine-light, #d14a67);

}

/* =========================================

   HOMEPAGE

========================================= */

.home {

  position: relative;

  z-index: 2;

  width: 100%;

  height: 100%;

  overflow: hidden;

  transition: opacity 0.45s ease;

}

.home.is-hidden {

  opacity: 0;

  pointer-events: none;

}

.hero {

  position: relative;

  width: 100%;

  height: 100%;

}

/*

  The composition uses the golden ratio as a

  spatial guide, not a rigid centering rule.

*/

.composition {

  position: absolute;

  top: 49%;

  left: 50%;

  width: min(1000px, 90vw);

  height: min(610px, 67vh);

  min-height: 350px;

  transform: translate(-50%, -50%);

}

.composition::before {

  content: "";

  position: absolute;

  top: 0;

  bottom: 0;

  left: var(--golden-major);

  width: 1px;

  background: linear-gradient(

    to bottom,

    transparent,

    rgba(210, 210, 220, 0.12) 20%,

    rgba(210, 210, 220, 0.08) 75%,

    transparent

  );

  opacity: 0.45;

  pointer-events: none;

}

.hero-kicker {

  position: absolute;

  top: 7%;

  left: 5%;

  color: #92929a;

  font: 9px/1.8 var(--mono);

  letter-spacing: 0.15em;

  text-transform: uppercase;

  animation: fadeIn 1.3s ease both;

}

.hero-kicker span {

  color: var(--wine);

}

.hero-note {

  position: absolute;

  top: 10%;

  right: 5%;

  max-width: 140px;

  color: #707078;

  font: 9px/1.9 var(--mono);

  letter-spacing: 0.04em;

  text-align: right;

  animation: fadeIn 1.8s ease both;

}

.hero-note strong {

  display: block;

  color: #c4c4c9;

  font-weight: 400;

}

.side-note {

  position: absolute;

  top: 48%;

  color: #65656e;

  font: 8px/1.8 var(--mono);

  letter-spacing: 0.11em;

  writing-mode: vertical-rl;

  pointer-events: none;

}

.side-note.left {

  left: 1%;

  transform: rotate(180deg);

}

.side-note.right {

  right: 1%;

}

.coordinates {

  position: absolute;

  left: clamp(22px, 4.2vw, 66px);

  bottom: 30px;

  color: #66666e;

  font: 9px/1.8 var(--mono);

  letter-spacing: 0.08em;

}

.coordinates span {

  color: var(--wine);

}

.system-status {

  position: absolute;

  right: clamp(22px, 4.2vw, 66px);

  bottom: 30px;

  display: flex;

  align-items: center;

  gap: 9px;

  color: #85858d;

  font: 9px var(--mono);

  letter-spacing: 0.08em;

}

.status-dot {

  width: 5px;

  height: 5px;

  border-radius: 50%;

  background: var(--wine);

  box-shadow: 0 0 10px rgba(164, 47, 77, 0.65);

  animation: pulse 3s ease-in-out infinite;

}

@keyframes fadeIn {

  from {

    opacity: 0;

    transform: translateY(7px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}

@keyframes pulse {

  0%, 100% {

    opacity: 0.45;

  }

  50% {

    opacity: 1;

  }

}

/* =========================================

   GENERATIVE TYPOGRAPHY

========================================= */

.letter-field {

  position: absolute;

  inset: 0;

  perspective: 900px;

}

/*

  Letters are positioned independently.

  The irregular offsets are intentional.

*/

.theme-letter {

  position: absolute;

  display: block;

  color: var(--green);

  font-family: var(--mono);

  font-size: clamp(15px, 1.55vw, 21px);

  font-weight: 400;

  line-height: 1;

  user-select: none;

  cursor: default;

  transform-origin: center;

  will-change: transform;

  opacity: 0;

  text-shadow:

    0 0 5px rgba(121, 255, 152, 0.18),

    0 0 15px rgba(121, 255, 152, 0.07);

  transition:

    color 0.25s ease,

    text-shadow 0.25s ease;

}

.theme-letter.is-visible {

  opacity: 1;

}

.theme-letter:hover {

  color: var(--green-light);

  text-shadow:

    0 0 8px rgba(121, 255, 152, 0.75),

    0 0 22px rgba(121, 255, 152, 0.25);

}

/* The word fragments stay horizontal. */

.word-fragment {

  position: absolute;

  inset: 0;

}

/* Small annotations remain grey or wine. */

.micro-note {

  position: absolute;

  color: #777780;

  font: 9px/1.8 var(--mono);

  letter-spacing: 0.08em;

  white-space: nowrap;

  pointer-events: none;

}

.micro-note.wine {

  color: #b54a63;

}

.micro-note.green {

  color: var(--green);

  opacity: 0.65;

}

/* =========================================

   SECTION NAVIGATION

========================================= */

.section-screen {

  position: fixed;

  inset: 0;

  z-index: 10;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 110px clamp(25px, 9vw, 150px) 65px;

  background:

    radial-gradient(

      ellipse at 68% 40%,

      rgba(45, 45, 53, 0.18),

      transparent 55%

    ),

    rgba(5, 5, 6, 0.97);

  opacity: 0;

  visibility: hidden;

  transform: translateY(12px);

  transition:

    opacity 0.4s ease,

    transform 0.4s ease,

    visibility 0.4s ease;

  overflow-y: auto;

}

.section-screen.is-open {

  opacity: 1;

  visibility: visible;

  transform: translateY(0);

}

.section-inner {

  width: 100%;

  max-width: 1000px;

  margin: auto;

}

.section-topline {

  display: flex;

  justify-content: space-between;

  gap: 20px;

  padding-bottom: 22px;

  border-bottom: 1px solid rgba(220, 220, 230, 0.16);

  color: #777780;

  font: 9px var(--mono);

  letter-spacing: 0.12em;

  text-transform: uppercase;

}

.section-topline span:last-child {

  color: var(--wine);

}

.section-title {

  margin: clamp(50px, 10vh, 100px) 0 30px;

  max-width: 900px;

  font: 400 clamp(48px, 9vw, 120px)/0.98 var(--serif);

  letter-spacing: -0.055em;

  overflow-wrap: anywhere;

}

.section-title em {

  color: var(--wine);

  font-weight: 400;

}

.section-description {

  max-width: 480px;

  color: #92929a;

  font-size: 13px;

  line-height: 2;

}

.section-bottom {

  margin-top: clamp(60px, 10vh, 100px);

  padding-top: 20px;

  border-top: 1px solid rgba(220, 220, 230, 0.13);

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;

}

.section-index {

  color: #686872;

  font: 9px var(--mono);

  letter-spacing: 0.1em;

}

.back-home {

  display: flex;

  align-items: center;

  gap: 12px;

  color: #bdbdc4;

  font-size: 10px;

  letter-spacing: 0.1em;

  cursor: pointer;

  transition: color 0.3s ease;

}

.back-home span:first-child {

  color: var(--wine);

  transition: transform 0.3s ease;

}

.back-home:hover {

  color: white;

}

.back-home:hover span:first-child {

  transform: translateX(-4px);

}

/* =========================================

   RESPONSIVE

========================================= */

@media (max-width: 950px) {

  .header {

    gap: 18px;

  }

  .header-right {

    gap: 22px;

  }

  .nav {

    gap: 16px;

  }

  .nav-link {

    font-size: 8px;

  }

  .composition {

    width: 92vw;

  }

}

@media (max-width: 700px) {

  .header {

    min-height: 108px;

    padding-top: 16px;

    padding-bottom: 14px;

    flex-direction: column;

    align-items: stretch;

    justify-content: center;

    gap: 15px;

  }

  .brand {

    align-self: flex-start;

  }

  .header-right {

    width: 100%;

    justify-content: space-between;

    gap: 12px;

  }

  .nav {

    display: grid;

    grid-template-columns: repeat(2, auto);

    gap: 9px 16px;

  }

  .nav-link {

    padding: 2px 0;

    font-size: 8px;

  }

  .nav-link::after {

    bottom: -3px;

  }

  .languages {

    gap: 5px;

  }

  .language {

    font-size: 9px;

  }

  .language + .language::before {

    margin-right: 5px;

  }

  .composition {

    top: 49%;

    width: 94vw;

    height: 52vh;

    min-height: 330px;

  }

  .hero-kicker {

    top: 5%;

    left: 5%;

    font-size: 8px;

  }

  .hero-note {

    top: 8%;

    right: 5%;

    max-width: 105px;

    font-size: 8px;

  }

  .theme-letter {

    font-size: 13px;

  }

  .side-note {

    font-size: 7px;

  }

  .coordinates,

  .system-status {

    bottom: 22px;

    font-size: 8px;

  }

  .section-screen {

    padding: 145px 25px 35px;

    align-items: flex-start;

  }

  .section-title {

    margin-top: 65px;

  }

  .section-description {

    font-size: 12px;

  }

}

@media (max-width: 390px) {

  .brand-name {

    font-size: 9px;

  }

  .nav {

    gap: 9px 11px;

  }

  .nav-link {

    font-size: 7px;

  }

  .hero-note {

    max-width: 90px;

  }

  .system-status {

    font-size: 7px;

  }

}

@media (prefers-reduced-motion: reduce) {

  *,

  *::before,

  *::after {

    animation-duration: 0.01ms !important;

    animation-iteration-count: 1 !important;

    transition-duration: 0.01ms !important;

  }

}

</style>

</head>

        category: "ARCHIVE / IDENTITÉ",

        number: "01 — 04",

        title: "À propos de <em>moi.</em>",

        description:

          "La personne derrière le travail. Des expériences, des tournants, des fragments de mémoire et des versions de moi qui continuent d'évoluer."

      },

      think: {

        category: "ARCHIVE / PENSÉE",

        number: "02 — 04",

        title: "Ce que je <em>pense.</em>",

        description:

          "Des notes sur le design, la culture visuelle, l'identité, la société et les questions qui restent ouvertes."

      },

      read: {

        category: "ARCHIVE / LECTURE",

        number: "03 — 04",

        title: "Ce que je <em>lis.</em>",

        description:

          "Des livres, des essais, des citations, des références et des fragments d'idées à conserver."

      },

      want: {

        category: "ARCHIVE / DEVENIR",

        number: "04 — 04",

        title: "Ce que je <em>veux.</em>",

        description:

          "Des directions futures, des ambitions personnelles, des lieux à découvrir et des possibilités qui n'ont pas encore pris forme."

      }

    }

  }

};

let currentLanguage = "en";

function applyLanguage(language) {

  if (!translations[language]) return;

  currentLanguage = language;

  document.documentElement.lang = language;

  const dictionary = translations[language];

  document.querySelectorAll("[data-i18n]").forEach((element) => {

    const key = element.dataset.i18n;

    if (dictionary[key] !== undefined) {

      element.innerHTML = dictionary[key];

    }

  });

  document.querySelectorAll(".language").forEach((button) => {

    const active = button.dataset.lang === language;

    button.classList.toggle("active", active);

    button.setAttribute("aria-pressed", String(active));

  });

  try {

    localStorage.setItem("archive-language", language);

  } catch (error) {}

  const activeLink = document.querySelector(".nav-link.active");

  if (activeLink) {

    renderSection(activeLink.dataset.section);

  }

}

document.querySelectorAll(".language").forEach((button) => {

  button.addEventListener("click", () => {

    applyLanguage(button.dataset.lang);

  });

});

try {

  const savedLanguage = localStorage.getItem("archive-language");

  if (savedLanguage && translations[savedLanguage]) {

    currentLanguage = savedLanguage;

  }

} catch (error) {}

/* =========================================

   02. GOLDEN-RATIO TYPOGRAPHY

========================================= */

/*

  Approximate golden-ratio placement:

  φ = 1.61803398875

  minor / major = 0.61803398875

  Each word stays readable, while each letter

  has its own spacing, offset and rotation.

*/

const stillLayout = [

  { x: 29.5, y: 40.0, r: -5 },

  { x: 33.0, y: 38.5, r: 3 },

  { x: 36.8, y: 41.0, r: -2 },

  { x: 40.0, y: 39.0, r: 5 },

  { x: 44.2, y: 42.0, r: -4 }

];

const becomingLayout = [

  { x: 40.5, y: 57.0, r: 4 },

  { x: 44.2, y: 55.5, r: -5 },

  { x: 47.6, y: 58.0, r: 3 },

  { x: 51.4, y: 56.0, r: -2 },

  { x: 55.0, y: 59.0, r: 5 },

  { x: 59.0, y: 56.5, r: -4 },

  { x: 62.7, y: 58.0, r: 2 },

  { x: 66.2, y: 55.5, r: -3 }

];

const stillWord = document.getElementById("stillWord");

const becomingWord = document.getElementById("becomingWord");

const composition = document.getElementById("composition");

const allLetters = [];

function buildWord(container, word, layout, wordIndex) {

  container.innerHTML = "";

  [...word].forEach((character, index) => {

    const span = document.createElement("span");

    span.className = "theme-letter";

    span.textContent = character;

    const point = layout[index];

    span.style.left = point.x + "%";

    span.style.top = point.y + "%";

    span.style.transitionDelay = (index * 28) + "ms";

    container.appendChild(span);

    allLetters.push({

      element: span,

      baseX: point.x,

      baseY: point.y,

      rotation: point.r,

      phase: Math.random() * Math.PI * 2,

      speed: 0.15 + Math.random() * 0.25,

      drift: 1.2 + Math.random() * 2.3,

      wordIndex,

      index

    });

  });

}

function buildTypography() {

  allLetters.length = 0;

  buildWord(stillWord, "STILL", stillLayout, 0);

  buildWord(becomingWord, "BECOMING", becomingLayout, 1);

  requestAnimationFrame(() => {

    allLetters.forEach((letter, index) => {

      setTimeout(() => {

        letter.element.classList.add("is-visible");

      }, 100 + index * 65);

    });

  });

}

/* =========================================

   03. INTERACTIVE LETTER MOTION

========================================= */

const pointer = {

  x: -1000,

  y: -1000,

  active: false

};

let motionTime = 0;

let letterAnimationFrame = null;

function animateTypography() {

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {

    letterAnimationFrame = null;

    return;

  }

  motionTime += 0.012;

  const rect = composition.getBoundingClientRect();

  allLetters.forEach((letter) => {

    const {

      element,

      baseX,

      baseY,

      rotation,

      phase,

      speed,

      drift

    } = letter;

    let dx = Math.sin(motionTime * speed + phase) * drift;

    let dy = Math.cos(motionTime * speed * 0.8 + phase) * drift;

    let mouseRotation = 0;

    const px = rect.left + rect.width * baseX / 100;

    const py = rect.top + rect.height * baseY / 100;

    if (pointer.active) {

      const mx = px - pointer.x;

      const my = py - pointer.y;

      const distance = Math.sqrt(mx * mx + my * my);

      const radius = 170;

      if (distance < radius && distance > 0) {

        const strength = (1 - distance / radius);

        dx += mx / distance * strength * 13;

        dy += my / distance * strength * 13;

        mouseRotation = mx / distance * strength * 9;

      }

    }

    element.style.transform =

      "translate(" +

      "calc(-50% + " + dx.toFixed(2) + "px), " +

      "calc(-50% + " + dy.toFixed(2) + "px)" +

      ") rotate(" +

      (

        rotation +

        Math.sin(motionTime * speed + phase) * 2.2 +

        mouseRotation

      ) +

      "deg)";

  });

  letterAnimationFrame = requestAnimationFrame(animateTypography);

}

function startTypographyAnimation() {

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {

    if (letterAnimationFrame !== null) {

      cancelAnimationFrame(letterAnimationFrame);

      letterAnimationFrame = null;

    }

    return;

  }

  if (letterAnimationFrame === null) {

    letterAnimationFrame = requestAnimationFrame(animateTypography);

  }

}

/* =========================================

   04. ABSTRACT SPATIAL DRAWING

========================================= */

const spaceCanvas = document.getElementById("spaceCanvas");

const spaceCtx = spaceCanvas.getContext("2d");

let W = 0;

let H = 0;

let DPR = 1;

let spatialTime = 0;

let spaceFrame = null;

let lastSpaceDraw = 0;

function resizeSpace() {

  DPR = Math.min(window.devicePixelRatio || 1, 2);

  W = window.innerWidth;

  H = window.innerHeight;

  spaceCanvas.width = Math.round(W * DPR);

  spaceCanvas.height = Math.round(H * DPR);

  spaceCanvas.style.width = W + "px";

  spaceCanvas.style.height = H + "px";

  spaceCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

  drawSpace(0);

}

/*

  Layered spatial curves:

  - varied density

  - broken paths

  - contour-like trajectories

  - low-opacity geometric structures

  - asymmetrical spatial clusters

*/

function drawContourFamily(ctx, config) {

  const {

    cx,

    cy,

    rx,

    ry,

    count,

    rotation,

    opacity,

    phase,

    broken

  } = config;

  ctx.save();

  ctx.translate(cx, cy);

  ctx.rotate(rotation);

  for (let i = 0; i < count; i++) {

    const t = i / Math.max(1, count - 1);

    const a = rx * (0.28 + t * 0.95);

    const b = ry * (0.3 + t * 0.92);

    const shift = Math.sin(phase + i * 0.31) * 13;

    const wobble = Math.cos(phase * 0.7 + i * 0.23) * 9;

    ctx.beginPath();

    const steps = 110;

    let penDown = false;

    for (let s = 0; s <= steps; s++) {

      const u = s / steps;

      const angle = u * Math.PI * 2;

      const irregular =

        1 +

        0.07 * Math.sin(angle * 3 + phase + i * 0.2) +

        0.035 * Math.cos(angle * 7 - phase);

      const x =

        Math.cos(angle) * a * irregular +

        Math.sin(angle * 2 + phase) * shift;

      const y =

        Math.sin(angle) * b * irregular +

        Math.cos(angle * 3 - phase) * wobble;

      /*

        Gaps produce a drawing that feels erased,

        interrupted or still under construction.

      */

      const gap =

        broken &&

        (

          (u > 0.17 + (i % 4) * 0.025 &&

           u < 0.21 + (i % 4) * 0.025) ||

          (u > 0.65 + (i % 5) * 0.018 &&

           u < 0.68 + (i % 5) * 0.018)

        );

      if (gap) {

        penDown = false;

        continue;

      }

      if (!penDown) {

        ctx.moveTo(x, y);

        penDown = true;

      } else {

        ctx.lineTo(x, y);

      }

    }

    const variation = 0.4 + (i % 5) * 0.12;

    ctx.strokeStyle =

      "rgba(220, 220, 230, " +

      (opacity * variation) +

      ")";

    ctx.lineWidth = i % 7 === 0 ? 0.8 : 0.45;

    ctx.stroke();

  }

  ctx.restore();

}

function drawSpatialGeometry(ctx, time) {

  /*

    The geometry is intentionally asymmetrical.

    Its main clusters avoid the exact center so

    the typography remains the focal point.

  */

  drawContourFamily(ctx, {

    cx: W * 0.13,

    cy: H * 0.45,

    rx: W * 0.18,

    ry: H * 0.30,

    count: 28,

    rotation: -0.44,

    opacity: 0.19,

    phase: time * 0.15,

    broken: true

  });

  drawContourFamily(ctx, {

    cx: W * 0.88,

    cy: H * 0.62,

    rx: W * 0.19,

    ry: H * 0.33,

    count: 31,

    rotation: 0.38,

    opacity: 0.15,

    phase: 1.8 + time * 0.12,

    broken: true

  });

  drawContourFamily(ctx, {

    cx: W * 0.52,

    cy: H * 0.12,

    rx: W * 0.24,

    ry: H * 0.12,

    count: 14,

    rotation: -0.12,

    opacity: 0.08,

    phase: 2.4,

    broken: false

  });

}

function drawVectorFragments(ctx, time) {

  const clusters = [

    { x: W * 0.12, y: H * 0.25, angle: -0.18 },

    { x: W * 0.82, y: H * 0.32, angle: 0.36 },

    { x: W * 0.25, y: H * 0.79, angle: -0.52 },

    { x: W * 0.75, y: H * 0.82, angle: 0.15 }

  ];

  clusters.forEach((cluster, index) => {

    const cx = cluster.x;

    const cy = cluster.y;

    ctx.save();

    ctx.translate(cx, cy);

    ctx.rotate(cluster.angle);

    for (let i = 0; i < 16; i++) {

      const x = i * 13 - 100;

      const y = Math.sin(i * 0.47 + index) * 30;

      const len = 20 + (i % 4) * 16;

      ctx.beginPath();

      ctx.moveTo(x, y);

      ctx.lineTo(x + len, y);

      ctx.strokeStyle = i % 4 === 0

        ? "rgba(195, 195, 207, 0.27)"

        : "rgba(195, 195, 207, 0.10)";

      ctx.lineWidth = 0.55;

      ctx.stroke();

      if (i % 4 === 0) {

        ctx.beginPath();

        ctx.arc(x, y, 1.1, 0, Math.PI * 2);

        ctx.fillStyle = "rgba(180, 70, 96, 0.65)";

        ctx.fill();

      }

    }

    ctx.restore();

  });

}

function drawStars(ctx, time) {

  const count = Math.min(

    180,

    Math.max(60, Math.floor(W * H / 7000))

  );

  for (let i = 0; i < count; i++) {

    const x = ((i * 7919) % 10007) / 10007 * W;

    const y = ((i * 3571) % 10009) / 10009 * H;

    const pulse =

      0.5 + 0.5 * Math.sin(time * 0.45 + i * 1.7);

    const radius = i % 17 === 0 ? 1.1 : 0.45;

    ctx.beginPath();

    ctx.arc(x, y, radius, 0, Math.PI * 2);

    ctx.fillStyle = i % 23 === 0

      ? "rgba(183, 66, 92, " + (0.12 + pulse * 0.24) + ")"

      : "rgba(210, 210, 222, " + (0.06 + pulse * 0.17) + ")";

    ctx.fill();

  }

}

function drawMouseField(ctx) {

  if (!pointer.active) return;

  const radius = 180;

  const gradient = ctx.createRadialGradient(

    pointer.x,

    pointer.y,

    0,

    pointer.x,

    pointer.y,

    radius

  );

  gradient.addColorStop(0, "rgba(145, 45, 67, 0.055)");

  gradient.addColorStop(1, "rgba(145, 45, 67, 0)");

  ctx.fillStyle = gradient;

  ctx.fillRect(

    pointer.x - radius,

    pointer.y - radius,

    radius * 2,

    radius * 2

  );

}

function drawSpace(time) {

  spaceCtx.clearRect(0, 0, W, H);

  const elapsed = time / 1000;

  drawStars(spaceCtx, elapsed);

  drawSpatialGeometry(spaceCtx, elapsed);

  drawVectorFragments(spaceCtx, elapsed);

  drawMouseField(spaceCtx);

}

function animateSpace(time) {

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {

    drawSpace(0);

    spaceFrame = null;

    return;

  }

  if (time - lastSpaceDraw > 45) {

    spatialTime = time;

    drawSpace(time);

    lastSpaceDraw = time;

  }

  spaceFrame = requestAnimationFrame(animateSpace);

}

function startSpaceAnimation() {

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {

    if (spaceFrame !== null) {

      cancelAnimationFrame(spaceFrame);

      spaceFrame = null;

    }

    drawSpace(0);

    return;

  }

  if (spaceFrame === null) {

    spaceFrame = requestAnimationFrame(animateSpace);

  }

}

/* =========================================

   05. SUBTLE ANALOG GRAIN

========================================= */

const grainCanvas = document.getElementById("grainCanvas");

const grainCtx = grainCanvas.getContext("2d");

let grainFrame = null;

function resizeGrain() {

  grainCanvas.width = Math.max(1, Math.floor(W / 3));

  grainCanvas.height = Math.max(1, Math.floor(H / 3));

  grainCanvas.style.width = W + "px";

  grainCanvas.style.height = H + "px";

  drawGrain();

}

function drawGrain() {

  const width = grainCanvas.width;

  const height = grainCanvas.height;

  const image = grainCtx.createImageData(width, height);

  const data = image.data;

  for (let i = 0; i < data.length; i += 4) {

    const noise = Math.random() * 255;

    data[i] = noise;

    data[i + 1] = noise;

    data[i + 2] = noise;

    data[i + 3] = Math.random() > 0.94 ? 19 : 5;

  }

  grainCtx.putImageData(image, 0, 0);

}

function animateGrain() {

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {

    grainFrame = null;

    return;

  }

  drawGrain();

  grainFrame = setTimeout(() => {

    grainFrame = requestAnimationFrame(animateGrain);

  }, 180);

}

/* =========================================

   06. MOUSE INPUT

========================================= */

window.addEventListener("pointermove", (event) => {

  pointer.x = event.clientX;

  pointer.y = event.clientY;

  pointer.active = true;

});

document.addEventListener("pointerleave", () => {

  pointer.active = false;

});

/* =========================================

   07. NAVIGATION PANELS

========================================= */

const home = document.getElementById("home");

const sectionScreen = document.getElementById("sectionScreen");

const sectionCategory = document.getElementById("sectionCategory");

const sectionNumber = document.getElementById("sectionNumber");

const sectionTitle = document.getElementById("sectionTitle");

const sectionDescription = document.getElementById("sectionDescription");

function renderSection(sectionKey) {

  const section =

    translations[currentLanguage].sections[sectionKey];

  if (!section) return;

  sectionCategory.textContent = section.category;

  sectionNumber.textContent = section.number;

  sectionTitle.innerHTML = section.title;

  sectionDescription.textContent = section.description;

}

function openSection(sectionKey, updateHash = true) {

  renderSection(sectionKey);

  home.classList.add("is-hidden");

  sectionScreen.classList.add("is-open");

  sectionScreen.setAttribute("aria-hidden", "false");

  document.querySelectorAll(".nav-link").forEach((link) => {

    const active = link.dataset.section === sectionKey;

    link.classList.toggle("active", active);

    if (active) {

      link.setAttribute("aria-current", "page");

    } else {

      link.removeAttribute("aria-current");

    }

  });

  if (updateHash) {

    history.pushState(

      { section: sectionKey },

      "",

      "#" + sectionKey

    );

  }

}

function goHome(updateHash = true) {

  sectionScreen.classList.remove("is-open");

  sectionScreen.setAttribute("aria-hidden", "true");

  home.classList.remove("is-hidden");

  document.querySelectorAll(".nav-link").forEach((link) => {

    link.classList.remove("active");

    link.removeAttribute("aria-current");

  });

  if (updateHash) {

    history.pushState(

      {},

      "",

      window.location.pathname + window.location.search

    );

  }

}

document.querySelectorAll(".nav-link").forEach((link) => {

  link.addEventListener("click", (event) => {

    event.preventDefault();

    openSection(link.dataset.section);

  });

});

document.getElementById("brandHome").addEventListener("click", (event) => {

  event.preventDefault();

  goHome();

});

document.getElementById("backHome").addEventListener("click", () => {

  goHome();

});

window.addEventListener("popstate", () => {

  const hash = window.location.hash.replace("#", "");

  const matchingLink = [...document.querySelectorAll(".nav-link")]

    .find((link) => link.dataset.section === hash);

  if (matchingLink) {

    openSection(matchingLink.dataset.section, false);

  } else {

    goHome(false);

  }

});

document.addEventListener("keydown", (event) => {

  if (event.key === "Escape") {

    goHome();

  }

});

/* =========================================

   08. INITIALIZATION

========================================= */

function initialize() {

  buildTypography();

  resizeSpace();

  resizeGrain();

  startSpaceAnimation();

  startTypographyAnimation();

  animateGrain();

  applyLanguage(currentLanguage);

}

window.addEventListener("resize", () => {

  resizeSpace();

  resizeGrain();

});

if (window.matchMedia("(prefers-reduced-motion: reduce)").addEventListener) {

  window.matchMedia("(prefers-reduced-motion: reduce)")

    .addEventListener("change", () => {

      startSpaceAnimation();

      startTypographyAnimation();

      if (grainFrame !== null) {

        clearTimeout(grainFrame);

        cancelAnimationFrame(grainFrame);

        grainFrame = null;

      }

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {

        animateGrain();

      } else {

        drawGrain();

      }

    });

}

initialize();

</script>
