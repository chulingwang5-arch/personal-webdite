<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050506">
<title>STILL BECOMING — A Living Archive</title>

<style>
:root {
  --black: #050506;
  --white: #efefec;
  --silver: #8b8b91;
  --dim: #45454b;
  --green: #a2ff9c;
  --wine: #a23b50;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --sans: Arial, Helvetica, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--black);
  color: var(--white);
  font-family: var(--mono);
}

body {
  overflow: hidden;
}

button,
a {
  color: inherit;
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  text-decoration: none;
}

::selection {
  background: var(--green);
  color: var(--black);
}

/* ---------- BACKGROUND ---------- */

#space {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

#grain {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  opacity: .12;
  pointer-events: none;
  mix-blend-mode: screen;
}

.vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at 50% 48%,
      transparent 10%,
      rgba(5,5,6,.12) 60%,
      rgba(5,5,6,.75) 100%
    );
}

/* ---------- HEADER ---------- */

header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 29px 4.1vw;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  z-index: 10;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.brand {
  justify-self: start;
  color: var(--white);
  background: none;
  border: none;
  padding: 0;
  font-size: 10px;
  letter-spacing: .13em;
  white-space: nowrap;
}

.brand span {
  color: var(--silver);
  margin-left: 8px;
}

nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(15px, 2.5vw, 38px);
}

nav a {
  position: relative;
  color: #a2a2a7;
  white-space: nowrap;
  transition: color .25s ease;
}

nav a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 100%;
  bottom: -7px;
  height: 1px;
  background: var(--green);
  transition: right .3s ease;
}

nav a:hover,
nav a.active {
  color: var(--white);
}

nav a:hover::after,
nav a.active::after {
  right: 0;
}

.languages {
  justify-self: end;
  display: flex;
  gap: 11px;
}

.languages button {
  background: none;
  border: 0;
  padding: 4px 0;
  font-size: 10px;
  color: #66666c;
}

.languages button.active,
.languages button:hover {
  color: var(--green);
}

/* ---------- MAIN COMPOSITION ---------- */

main {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 520px;
  overflow: hidden;
  z-index: 3;
}

.composition {
  position: absolute;
  width: min(82vw, 1120px);
  height: min(66vh, 590px);
  min-height: 390px;
  left: 50%;
  top: 49%;
  transform: translate(-50%, -50%);
}

/* Golden-ratio registration line */

.registration {
  position: absolute;
  left: 61.8%;
  top: 0;
  height: 100%;
  width: 1px;
  background: rgba(255,255,255,.11);
}

.registration::before,
.registration::after {
  content: "";
  position: absolute;
  left: -3px;
  width: 7px;
  height: 1px;
  background: rgba(255,255,255,.38);
}

.registration::before {
  top: 38.2%;
}

.registration::after {
  top: 61.8%;
}

/* Fine registration marks */

.cross {
  position: absolute;
  width: 11px;
  height: 11px;
  opacity: .6;
}

.cross::before,
.cross::after {
  content: "";
  position: absolute;
  background: rgba(255,255,255,.5);
}

.cross::before {
  left: 5px;
  top: 0;
  width: 1px;
  height: 11px;
}

.cross::after {
  top: 5px;
  left: 0;
  width: 11px;
  height: 1px;
}

.cross.one {
  left: 29.5%;
  top: 25%;
}

.cross.two {
  left: 77%;
  top: 72%;
}

.cross.three {
  left: 15%;
  top: 76%;
  transform: scale(.65);
}

/* ---------- TITLE ---------- */

.title-field {
  position: absolute;
  inset: 0;
}

.word {
  position: absolute;
  height: 100px;
  display: flex;
  align-items: center;
  white-space: nowrap;
}

.word-one {
  left: 17%;
  top: 28%;
}

.word-two {
  left: 34%;
  top: 51%;
}

.letter {
  display: inline-block;
  position: relative;
  color: var(--green);
  font-family: var(--sans);
  font-size: clamp(47px, 7.3vw, 104px);
  line-height: .9;
  font-weight: 400;
  letter-spacing: -.085em;
  transform-origin: center center;
  will-change: transform;
  transition: color .25s ease;
  user-select: none;
}

.letter:hover {
  color: #e4ffe1;
  text-shadow: 0 0 20px rgba(162,255,156,.3);
}

.word-one .letter:nth-child(1) { margin-right: .04em; }
.word-one .letter:nth-child(2) { margin-right: .01em; }
.word-one .letter:nth-child(3) { margin-right: .11em; }
.word-one .letter:nth-child(4) { margin-right: -.015em; }
.word-one .letter:nth-child(5) { margin-right: 0; }

.word-two .letter:nth-child(1) { margin-right: .08em; }
.word-two .letter:nth-child(2) { margin-right: -.025em; }
.word-two .letter:nth-child(3) { margin-right: .035em; }
.word-two .letter:nth-child(4) { margin-right: .12em; }
.word-two .letter:nth-child(5) { margin-right: -.025em; }
.word-two .letter:nth-child(6) { margin-right: .06em; }
.word-two .letter:nth-child(7) { margin-right: -.02em; }
.word-two .letter:nth-child(8) { margin-right: 0; }

/* Small labels */

.label {
  position: absolute;
  font-size: 9px;
  line-height: 1.8;
  color: var(--silver);
  letter-spacing: .13em;
  text-transform: uppercase;
}

.label-top {
  left: 17.3%;
  top: 18%;
}

.label-right {
  right: 0;
  top: 38.2%;
  text-align: right;
}

.label-left {
  left: 0;
  top: 62%;
}

.label-bottom {
  right: 0;
  bottom: 10%;
  text-align: right;
}

.label .accent {
  color: var(--wine);
}

/* ---------- FOOTER ---------- */

footer {
  position: fixed;
  z-index: 10;
  left: 4.1vw;
  right: 4.1vw;
  bottom: 27px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  color: #77777d;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  line-height: 1.9;
}

.footer-right {
  text-align: right;
}

.status-dot {
  display: inline-block;
  width: 5px;
  height: 5px;
  margin-right: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 9px rgba(162,255,156,.4);
  animation: blink 2.4s infinite;
}

@keyframes blink {
  0%, 100% { opacity: .9; }
  50% { opacity: .3; }
}

/* ---------- SECTION OVERLAY ---------- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  background: rgba(5,5,6,.96);
  opacity: 0;
  visibility: hidden;
  transition: opacity .35s ease, visibility .35s ease;
}

.overlay.open {
  opacity: 1;
  visibility: visible;
}

.panel {
  position: relative;
  width: min(680px, 100%);
  border-top: 1px solid rgba(255,255,255,.25);
  padding-top: 22px;
}

.panel-index {
  color: var(--wine);
  font-size: 10px;
  letter-spacing: .15em;
  margin-bottom: 35px;
}

.panel h1 {
  margin: 0 0 24px;
  font-family: var(--sans);
  font-size: clamp(35px, 7vw, 68px);
  font-weight: 400;
  letter-spacing: -.06em;
}

.panel p {
  max-width: 460px;
  color: #99999f;
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.9;
}

.close-panel {
  margin-top: 32px;
  padding: 10px 0;
  border: none;
  border-bottom: 1px solid #777;
  background: none;
  color: var(--white);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.close-panel:hover {
  color: var(--green);
  border-color: var(--green);
}

/* ---------- MOBILE ---------- */

@media (max-width: 760px) {
  body {
    overflow: hidden;
  }

  header {
    padding: 22px 6vw;
    grid-template-columns: 1fr auto;
    row-gap: 23px;
  }

  .brand {
    font-size: 9px;
  }

  .languages {
    grid-column: 2;
    grid-row: 1;
  }

  nav {
    grid-column: 1 / -1;
    grid-row: 2;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    font-size: 8px;
  }

  .composition {
    width: 92vw;
    height: 54vh;
    min-height: 320px;
    top: 51%;
  }

  .word {
    height: 70px;
  }

  .word-one {
    left: 3%;
    top: 30%;
  }

  .word-two {
    left: 16%;
    top: 49%;
  }

  .letter {
    font-size: clamp(36px, 10.2vw, 72px);
    letter-spacing: -.08em;
  }

  .label {
    font-size: 7px;
  }

  .label-top {
    left: 3%;
    top: 18%;
  }

  .label-right {
    right: 2%;
    top: 37%;
  }

  .label-left {
    left: 2%;
    top: 65%;
  }

  .label-bottom {
    right: 2%;
    bottom: 7%;
  }

  footer {
    left: 6vw;
    right: 6vw;
    bottom: 18px;
    font-size: 7px;
  }
}

@media (max-width: 390px) {
  nav {
    font-size: 7px;
  }

  .word-one {
    left: 1%;
  }

  .word-two {
    left: 9%;
  }

  .letter {
    font-size: 9.5vw;
  }

  .label-right {
    right: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<canvas id="space" aria-hidden="true"></canvas>
<canvas id="grain" aria-hidden="true"></canvas>

    </button>

</section>

<script>
/* =====================================================
   1. LANGUAGE SYSTEM
===================================================== */

const translations = {
  en: {

    navThoughts: "About what I think",
    navReading: "About what I read",
    navDesire: "About what I want",
    topLabel: 'PERSONAL ARCHIVE<br><span class="accent">A WORK IN PROGRESS</span>',
    rightLabel: "AN OPEN<br>SYSTEM",
    leftLabel: "NOT FIXED.<br>NOT FINISHED.",
    bottomLabel: "FORM / THOUGHT / BECOMING",
    status: "SYSTEM EVOLVING",
    footerTop: "A PERSONAL UNIVERSE",
    back: "← Back to the beginning",
    sections: {
      about: {
        index: "ARCHIVE / 001",
        title: "About me",
        description: "A collection of fragments, experiences and identities. Not a fixed portrait, but a self in continuous formation."
      },

      },

  zh: {
    navAbout: "关于我",
    navThoughts: "关于思考",
    navReading: "关于阅读",
    navDesire: "关于渴望",
    topLabel: '个人档案<br><span class="accent">持续生成中</span>',
    rightLabel: "一个开放的<br>系统",
    leftLabel: "未被定义。<br>尚未完成。",
    bottomLabel: "形式 / 思想 / 生成",
    status: "系统持续演变",
    footerTop: "一个私人宇宙",
    back: "← 回到起点",
    sections: {
      about: {
        index: "档案 / 001",
        title: "关于我",
        description: "关于身份、经历与自我认知的片段。这不是一幅固定的肖像，而是一个仍在不断形成中的自我。"
      },
      thoughts: {
        index: "档案 / 002",
        title: "关于思考",
        description: "关于设计、图像、城市与文化的观察，以及那些悄然影响我们观看世界的结构。"
      },
      reading: {
        index: "档案 / 003",
        title: "关于阅读",
        description: "书籍、文章、视觉参考与那些在合上书页之后，仍然留在脑海里的想法。"
      },
      desire: {
        index: "档案 / 004",
        title: "关于渴望",
        description: "尚未完成的野心、仍有可能的未来，以及那些暂时还无法准确描述的事物。"
      }
    }
  },

  fr: {
    navAbout: "À propos de moi",
    navThoughts: "Mes réflexions",
    navReading: "Mes lectures",
    navDesire: "Mes aspirations",
    topLabel: 'ARCHIVE PERSONNELLE<br><span class="accent">EN COURS DE CRÉATION</span>',
    rightLabel: "UN SYSTÈME<br>OUVERT",
    leftLabel: "NON FIXÉE.<br>INACHEVÉE.",
    bottomLabel: "FORME / PENSÉE / DEVENIR",
    status: "SYSTÈME EN ÉVOLUTION",
    footerTop: "UN UNIVERS PERSONNEL",
    back: "← Retour au commencement",
    sections: {
      about: {
        index: "ARCHIVE / 001",
        title: "À propos de moi",
        description: "Des fragments d'identité, d'expériences et de perceptions. Non pas un portrait figé, mais un être en formation continue."
      },
      thoughts: {
        index: "ARCHIVE / 002",
        title: "Mes réflexions",
        description: "Des notes sur le design, les images, les villes et la culture, ainsi que sur les structures discrètes qui façonnent notre regard."
      },
      reading: {
        index: "ARCHIVE / 003",
        title: "Mes lectures",
        description: "Des livres, des essais, des références visuelles et des idées qui persistent bien après la dernière page."
      },
      desire: {
        index: "ARCHIVE / 004",
        title: "Mes aspirations",
        description: "Des ambitions inachevées, des futurs possibles et des choses que je ne sais pas encore décrire avec précision."
      }
    }
  }
};

let currentLanguage = "en";

function setLanguage(language) {
  currentLanguage = language;

  document.documentElement.lang =
    language === "zh" ? "zh-CN" : language;

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;
    const value = translations[language][key];

    if (value !== undefined) {
      element.innerHTML = value;
    }
  });

  document.querySelectorAll("[data-lang]").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.lang === language
    );
  });

  if (activeSection) {
    openSection(activeSection);
  }
}

document.querySelectorAll("[data-lang]").forEach(button => {
  button.addEventListener("click", () => {
    setLanguage(button.dataset.lang);
  });
});

/* =====================================================
   2. GENERATIVE LETTERS
===================================================== */

const words = document.querySelectorAll(".word");
const letters = [];
const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

words.forEach(word => {
  const text = word.dataset.word;

  [...text].forEach((character, index) => {
    const span = document.createElement("span");
    span.className = "letter";
    span.textContent = character;

    const seed = (index + 1) * 1.73 +
                 text.length * 0.41;

    const rotation = Math.sin(seed) * 3.2;
    const driftX = Math.sin(seed * 1.4) * 2.5;
    const driftY = Math.cos(seed * 1.8) * 2.4;

    span.dataset.rotation = rotation;
    span.dataset.driftX = driftX;
    span.dataset.driftY = driftY;

    span.style.transform =
      `translate(${driftX}px, ${driftY}px) rotate(${rotation}deg)`;

    word.appendChild(span);

    letters.push({
      element: span,
      rotation,
      driftX,
      driftY,
      phase: seed,
      x: 0,
      y: 0
    });
  });
});

let mouseX = -1000;
let mouseY = -1000;
let smoothMouseX = -1000;
let smoothMouseY = -1000;

window.addEventListener("pointermove", event => {
  mouseX = event.clientX;
  mouseY = event.clientY;
}, { passive: true });

window.addEventListener("pointerleave", () => {
  mouseX = -1000;
  mouseY = -1000;
});

let animationFrame;

function animateLetters(time) {
  smoothMouseX += (mouseX - smoothMouseX) * 0.08;
  smoothMouseY += (mouseY - smoothMouseY) * 0.08;

  letters.forEach(letter => {
    const rect = letter.element.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const dx = centerX - smoothMouseX;
    const dy = centerY - smoothMouseY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    let pushX = 0;
    let pushY = 0;
    let pushRotation = 0;

    if (!reducedMotion && distance < 180) {
      const force = (180 - distance) / 180;
      pushX = (dx / (distance || 1)) * force * 13;
      pushY = (dy / (distance || 1)) * force * 11;
      pushRotation = (dx / 180) * force * 5;
    }

    const breathingX = reducedMotion
      ? 0
      : Math.sin(time * 0.0005 + letter.phase) * 1.4;

    const breathingY = reducedMotion
      ? 0
      : Math.cos(time * 0.0004 + letter.phase) * 1.2;

    letter.element.style.transform = `
      translate(
        ${letter.driftX + pushX + breathingX}px,
        ${letter.driftY + pushY + breathingY}px
      )
      rotate(${letter.rotation + pushRotation}deg)
    `;
  });

  animationFrame = requestAnimationFrame(animateLetters);
}

animateLetters(0);

/* =====================================================
   3. ABSTRACT SPATIAL FIELD
   Layered cartography, interrupted trajectories,
   architectural vectors and gestural line systems.
===================================================== */

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;
let paths = [];
let stars = [];

function seededRandom(seed) {
  let value = seed >>> 0;

  return function() {
    value = (value * 1664525 + 1013904223) >>> 0;
    return value / 4294967296;
  };
}

function buildSpace() {
  const random = seededRandom(20000907);

  paths = [];
  stars = [];

  const lineCount = Math.max(
    40,
    Math.min(95, Math.floor(width / 14))
  );

  for (let i = 0; i < lineCount; i++) {
    const side = random() > .5 ? -1 : 1;

    const startX = random() * width;
    const startY = random() * height;

    const length = width * (.12 + random() * .6);
    const bend = (random() - .5) * height * .55;

    const segments = [];
    const steps = 4 + Math.floor(random() * 8);

    for (let j = 0; j <= steps; j++) {
      const t = j / steps;

      segments.push({
        x: startX + side * length * t,
        y: startY + bend * t +
           Math.sin(t * Math.PI * (1 + random())) *
           height * .035
      });
    }

    paths.push({
      segments,
      opacity: .06 + random() * .31,
      width: random() > .8 ? 1.15 : .55 + random() * .35,
      dash: random() > .45
        ? []
        : [random() * 5 + 2, random() * 12 + 4],
      offset: random() * 30,
      drift: (random() - .5) * 8,
      phase: random() * Math.PI * 2
    });
  }

  const starCount = Math.floor(width * height / 8000);

  for (let i = 0; i < starCount; i++) {
    stars.push({
      x: random() * width,
      y: random() * height,
      radius: random() > .92 ? 1.2 : random() * .7 + .15,
      opacity: random() * .65
    });
  }
}

function resizeSpace() {
  width = window.innerWidth;
  height = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  buildSpace();
  drawSpace(0);
}

function drawSpace(time) {
  ctx.clearRect(0, 0, width, height);

  /* Faint cartographic grid fragments */
  ctx.save();
  ctx.lineWidth = .45;
  ctx.strokeStyle = "rgba(210,215,225,.10)";

  const gridStep = 82;

  for (let x = 0; x < width; x += gridStep) {
    for (let y = 0; y < height; y += gridStep) {
      const selector = Math.sin(x * .02 + y * .017);

      if (selector > .2) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 13, y);
        ctx.stroke();
      }

      if (selector < -.5) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + 9);
        ctx.stroke();
      }
    }
  }

  ctx.restore();

  /* Distant stars and registration points */
  stars.forEach(star => {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(240,242,247,${star.opacity})`;
    ctx.fill();
  });

  /* Layered trajectories */
  paths.forEach((path, index) => {
    const movement = reducedMotion
      ? 0
      : Math.sin(time * .00018 + path.phase) * path.drift;

    ctx.save();
    ctx.beginPath();

    path.segments.forEach((point, i) => {
      const x = point.x;
      const y = point.y + movement;

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        const previous = path.segments[i - 1];
        const midX = (previous.x + x) / 2;
        const midY = (previous.y + y) / 2;

        ctx.quadraticCurveTo(
          previous.x,
          previous.y + movement,
          midX,
          midY
        );
      }
    });

    ctx.strokeStyle =
      `rgba(220,224,232,${path.opacity})`;

    ctx.lineWidth = path.width;
    ctx.setLineDash(path.dash);
    ctx.lineDashOffset = path.offset;

    ctx.stroke();
    ctx.restore();

    /* Selected paths break into isolated fragments */
    if (index % 5 === 0) {
      const point = path.segments[
        Math.floor(path.segments.length * .58)
      ];

      ctx.beginPath();
      ctx.moveTo(point.x - 9, point.y + movement + 3);
      ctx.lineTo(point.x + 20, point.y + movement - 2);

      ctx.strokeStyle =
        "rgba(220,224,232,.48)";

      ctx.lineWidth = .65;
      ctx.stroke();
    }
  });

  /* Fine diagonal vectors */
  ctx.save();
  ctx.lineWidth = .55;

  for (let i = 0; i < 12; i++) {
    const x = width * ((i * .137 + .09) % 1);
    const y = height * ((i * .213 + .17) % 1);
    const length = 25 + (i % 4) * 17;

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + length, y - length * .37);

    ctx.strokeStyle = i % 3 === 0
      ? "rgba(162,255,156,.24)"
      : "rgba(240,240,245,.25)";

    ctx.setLineDash(i % 2 === 0 ? [2, 5] : []);
    ctx.stroke();
  }

  ctx.restore();

  /* Mouse-responsive field: subtle distortion */
  if (!reducedMotion && mouseX > 0 && mouseY > 0) {
    const radius = 210;
    const gradient = ctx.createRadialGradient(
      mouseX, mouseY, 0,
      mouseX, mouseY, radius
    );

    gradient.addColorStop(0, "rgba(162,255,156,.035)");
    gradient.addColorStop(1, "rgba(162,255,156,0)");

    ctx.fillStyle = gradient;
    ctx.fillRect(
      mouseX - radius,
      mouseY - radius,
      radius * 2,
      radius * 2
    );
  }
}

function animateSpace(time) {
  drawSpace(time);

  if (!reducedMotion) {
    requestAnimationFrame(animateSpace);
  }
}

window.addEventListener("resize", resizeSpace);

resizeSpace();

if (!reducedMotion) {
  requestAnimationFrame(animateSpace);
}

/* =====================================================
   4. SUBTLE ANALOG GRAIN
===================================================== */

const grainCanvas = document.getElementById("grain");
const grainCtx = grainCanvas.getContext("2d");

function resizeGrain() {
  grainCanvas.width = Math.ceil(window.innerWidth / 3);
  grainCanvas.height = Math.ceil(window.innerHeight / 3);

  grainCanvas.style.width = window.innerWidth + "px";
  grainCanvas.style.height = window.innerHeight + "px";
}

function drawGrain() {
  const imageData = grainCtx.createImageData(
    grainCanvas.width,
    grainCanvas.height
  );

  const data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {
    const noise = Math.random() * 255;

    data[i] = noise;
    data[i + 1] = noise;
    data[i + 2] = noise;
    data[i + 3] = Math.random() * 24;
  }

  grainCtx.putImageData(imageData, 0, 0);
}

resizeGrain();

let grainFrame;

function animateGrain() {
  drawGrain();

  if (!reducedMotion) {
    grainFrame = setTimeout(() => {
      requestAnimationFrame(animateGrain);
    }, 180);
  }
}

animateGrain();

window.addEventListener("resize", resizeGrain);

/* =====================================================
   5. NAVIGATION AND SECTION PANELS
===================================================== */

const overlay = document.getElementById("overlay");
const panelIndex = document.getElementById("panelIndex");
const panelTitle = document.getElementById("panelTitle");
const panelDescription = document.getElementById("panelDescription");

let activeSection = null;

function openSection(section) {
  const content = translations[currentLanguage].sections[section];

  if (!content) return;

  activeSection = section;

  panelIndex.textContent = content.index;
  panelTitle.textContent = content.title;
  panelDescription.textContent = content.description;

  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");

  document.querySelectorAll("nav a").forEach(link => {
    link.classList.toggle(
      "active",
      link.dataset.section === section
    );
  });

  history.replaceState(null, "", "#" + section);
}

function closeSection() {
  activeSection = null;

  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");

  document.querySelectorAll("nav a").forEach(link => {
    link.classList.remove("active");
  });

  history.replaceState(
    null,
    "",
    window.location.pathname + window.location.search
  );
}

document.querySelectorAll("nav a").forEach(link => {
  link.addEventListener("click", event => {
    event.preventDefault();
    openSection(link.dataset.section);
  });
});

document.getElementById("homeButton").addEventListener(
  "click",
  closeSection
);

document.getElementById("closePanel").addEventListener(
  "click",
  closeSection
);

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeSection();
  }
});

overlay.addEventListener("click", event => {
  if (event.target === overlay) {
    closeSection();
  }
});

/* =====================================================
   6. INITIALIZATION
===================================================== */

document.getElementById("year").textContent =
  new Date().getFullYear();

setLanguage("en");
</script>
