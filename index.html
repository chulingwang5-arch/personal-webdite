<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050506">

<title>STILL BECOMING — A Living Archive</title>

<style>

:root {

  --black: #050506;

  --white: #e8e8e5;

  --silver: #85858b;

  --muted: #55555b;

  /* Dark green with a restrained phosphorescent quality */

  --green: #416c49;

  --green-light: #608a64;

  --green-glow: rgba(78, 139, 83, .12);

  /* Near-black burgundy */

  --wine: #431c27;

  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  --sans: Arial, Helvetica, sans-serif;

}

* {

  box-sizing: border-box;

}

html,

body {

  width: 100%;

  height: 100%;

  margin: 0;

  background: var(--black);

  color: var(--white);

  font-family: var(--mono);

}

body {

  overflow: hidden;

}

button,

a {

  font: inherit;

}

button {

  color: inherit;

  cursor: pointer;

}

a {

  color: inherit;

  text-decoration: none;

}

::selection {

  background: var(--green);

  color: var(--black);

}

/* ========================================

   BACKGROUND

======================================== */

#space,

#grain {

  position: fixed;

  inset: 0;

  width: 100%;

  height: 100%;

  pointer-events: none;

}

#space {

  z-index: 0;

}

#grain {

  z-index: 2;

  opacity: .075;

  mix-blend-mode: screen;

}

.vignette {

  position: fixed;

  inset: 0;

  z-index: 1;

  pointer-events: none;

  background:

    radial-gradient(

      ellipse at 50% 48%,

      rgba(5, 5, 6, 0) 0%,

      rgba(5, 5, 6, .12) 48%,

      rgba(5, 5, 6, .62) 100%

    );

}

/* A subtle blurred atmosphere behind the composition */

.atmosphere {

  position: fixed;

  inset: -10%;

  z-index: 1;

  pointer-events: none;

  background:

    radial-gradient(

      ellipse at 34% 43%,

      rgba(38, 58, 43, .055),

      transparent 39%

    ),

    radial-gradient(

      ellipse at 76% 63%,

      rgba(46, 37, 45, .045),

      transparent 35%

    );

  filter: blur(45px);

}

/* ========================================

   HEADER

======================================== */

header {

  position: fixed;

  z-index: 10;

  top: 0;

  left: 0;

  width: 100%;

  padding: 29px 4.1vw;

  display: grid;

  grid-template-columns: 1fr auto 1fr;

  align-items: center;

  gap: 25px;

  font-size: 10px;

  letter-spacing: .10em;

  text-transform: uppercase;

}

.brand {

  justify-self: start;

  padding: 0;

  border: 0;

  background: transparent;

  font-size: 10px;

  letter-spacing: .11em;

  white-space: nowrap;

}

.brand span {

  margin-left: 7px;

  color: var(--muted);

}

nav {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: clamp(15px, 2.3vw, 34px);

  white-space: nowrap;

}

nav a {

  position: relative;

  padding: 5px 0;

  color: #929297;

  transition: color .25s ease;

}

nav a::after {

  content: "";

  position: absolute;

  left: 0;

  right: 100%;

  bottom: -3px;

  height: 1px;

  background: var(--green);

  transition: right .3s ease;

}

nav a:hover,

nav a.active {

  color: var(--white);

}

nav a:hover::after,

nav a.active::after {

  right: 0;

}

.languages {

  display: flex;

  justify-self: end;

  gap: 12px;

}

.languages button {

  padding: 3px 0;

  border: 0;

  background: none;

  color: #606067;

  font-size: 10px;

}

.languages button.active,

.languages button:hover {

  color: var(--green-light);

}

/* ========================================

   MAIN COMPOSITION

======================================== */

main {

  position: relative;

  z-index: 3;

  width: 100%;

  height: 100vh;

  height: 100svh;

  min-height: 500px;

  overflow: hidden;

}

.composition {

  position: absolute;

  left: 50%;

  top: 49%;

  width: min(82vw, 1120px);

  height: min(66vh, 590px);

  min-height: 390px;

  transform: translate(-50%, -50%);

}

/* Golden-ratio reference */

.registration {

  position: absolute;

  left: 61.8%;

  top: 0;

  width: 1px;

  height: 100%;

  background: rgba(230, 230, 235, .055);

}

.registration::before,

.registration::after {

  content: "";

  position: absolute;

  left: -2px;

  width: 5px;

  height: 1px;

  background: rgba(230, 230, 235, .22);

}

.registration::before {

  top: 38.2%;

}

.registration::after {

  top: 61.8%;

}

/* Sparse registration marks */

.cross {

  position: absolute;

  width: 9px;

  height: 9px;

  opacity: .42;

}

.cross::before,

.cross::after {

  content: "";

  position: absolute;

  background: rgba(220, 220, 225, .34);

}

.cross::before {

  left: 4px;

  width: 1px;

  height: 9px;

}

.cross::after {

  top: 4px;

  width: 9px;

  height: 1px;

}

.cross-a {

  left: 19%;

  top: 26%;

}

.cross-b {

  left: 77%;

  top: 71%;

  transform: scale(.7);

}

/* ========================================

   TITLE

======================================== */

.title-field {

  position: absolute;

  inset: 0;

  display: grid;

  grid-template-columns: 1fr;

  grid-template-rows: 1fr 1fr;

}

/*

  Both words are forced into horizontal rows.

  Their size is close to the navigation font size.

*/

.word {

  position: relative;

  display: flex;

  flex-direction: row;

  flex-wrap: nowrap;

  align-items: center;

  justify-content: flex-start;

  width: max-content;

  max-width: none;

  height: auto;

  white-space: nowrap;

  writing-mode: horizontal-tb;

  overflow: visible;

}

.word-one {

  grid-row: 1;

  align-self: center;

  justify-self: start;

  margin-left: 25%;

  margin-top: 2%;

}

.word-two {

  grid-row: 2;

  align-self: start;

  justify-self: start;

  margin-left: 39%;

  margin-top: -1%;

}

.letter {

  display: inline-block;

  flex: 0 0 auto;

  position: relative;

  white-space: pre;

  writing-mode: horizontal-tb;

  font-family: var(--mono);

  font-size: clamp(10px, .8vw, 12px);

  font-weight: 400;

  line-height: 1;

  letter-spacing: .025em;

  color: var(--green);

  text-shadow:

    0 0 5px rgba(78, 139, 83, .10);

  transform-origin: center;

  will-change: transform;

  pointer-events: auto;

  user-select: none;

  transition:

    color .3s ease,

    text-shadow .3s ease;

}

.letter:hover {

  color: var(--green-light);

  text-shadow:

    0 0 5px rgba(78, 139, 83, .20),

    0 0 11px rgba(78, 139, 83, .09);

}

/* Irregular spacing: controlled rather than chaotic */

.word-one .letter:nth-child(1) {

  margin-right: .06em;

}

.word-one .letter:nth-child(2) {

  margin-right: .025em;

}

.word-one .letter:nth-child(3) {

  margin-right: .20em;

}

.word-one .letter:nth-child(4) {

  margin-right: -.025em;

}

.word-one .letter:nth-child(5) {

  margin-right: 0;

}

.word-two .letter:nth-child(1) {

  margin-right: .12em;

}

.word-two .letter:nth-child(2) {

  margin-right: -.025em;

}

.word-two .letter:nth-child(3) {

  margin-right: .04em;

}

.word-two .letter:nth-child(4) {

  margin-right: .19em;

}

.word-two .letter:nth-child(5) {

  margin-right: -.025em;

}

.word-two .letter:nth-child(6) {

  margin-right: .08em;

}

.word-two .letter:nth-child(7) {

  margin-right: -.015em;

}

/* Editorial notes */

.label {

  position: absolute;

  color: var(--silver);

  font-size: 9px;

  line-height: 1.8;

  letter-spacing: .12em;

  text-transform: uppercase;

}

.label-top {

  left: 25.2%;

  top: 27%;

}

.label-right {

  right: 0;

  top: 38.2%;

  text-align: right;

}

.label-left {

  left: 0;

  top: 63%;

}

.label-bottom {

  right: 0;

  bottom: 9%;

  text-align: right;

}

.accent {

  color: var(--wine);

}

/* ========================================

   FOOTER

======================================== */

footer {

  position: fixed;

  z-index: 10;

  left: 4.1vw;

  right: 4.1vw;

  bottom: 25px;

  display: flex;

  justify-content: space-between;

  align-items: flex-end;

  color: #77777d;

  font-size: 9px;

  line-height: 1.9;

  letter-spacing: .1em;

  text-transform: uppercase;

}

.footer-right {

  text-align: right;

}

.status-dot {

  display: inline-block;

  width: 5px;

  height: 5px;

  margin-right: 7px;

  border-radius: 50%;

  background: var(--wine);

  box-shadow: 0 0 5px rgba(67, 28, 39, .25);

}

/* ========================================

   SECTION PANELS

======================================== */

.overlay {

  position: fixed;

  z-index: 30;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 30px;

  background: rgba(5, 5, 6, .97);

  opacity: 0;

  visibility: hidden;

  transition:

    opacity .3s ease,

    visibility .3s ease;

}

.overlay.open {

  opacity: 1;

  visibility: visible;

}

.panel {

  width: min(680px, 100%);

  padding-top: 23px;

  border-top: 1px solid rgba(255, 255, 255, .23);

}

.panel-index {

  margin-bottom: 34px;

  color: var(--wine);

  font-size: 10px;

  letter-spacing: .14em;

}

.panel h1 {

  margin: 0 0 24px;

  font-family: var(--sans);

  font-size: clamp(36px, 7vw, 68px);

  font-weight: 400;

  letter-spacing: -.055em;

}

.panel p {

  max-width: 480px;

  color: #a0a0a5;

  font-family: var(--sans);

  font-size: 15px;

  line-height: 1.9;

}

.close-panel {

  margin-top: 30px;

  padding: 10px 0;

  border: 0;

  border-bottom: 1px solid #55555b;

  background: none;

  color: var(--white);

  font-size: 10px;

  letter-spacing: .12em;

  text-transform: uppercase;

}

.close-panel:hover {

  color: var(--green-light);

  border-color: var(--green);

}

/* ========================================

   RESPONSIVE

======================================== */

@media (max-width: 900px) {

  header {

    grid-template-columns: 1fr auto;

    row-gap: 22px;

  }

  .brand {

    grid-column: 1;

    grid-row: 1;

  }

  .languages {

    grid-column: 2;

    grid-row: 1;

  }

  nav {

    grid-column: 1 / -1;

    grid-row: 2;

    width: 100%;

    justify-content: space-between;

    gap: 10px;

    font-size: 9px;

  }

  .composition {

    width: 92vw;

    height: 55vh;

  }

  .word-one {

    margin-left: 20%;

  }

  .word-two {

    margin-left: 35%;

  }

  .label {

    font-size: 8px;

  }

}

@media (max-width: 520px) {

  header {

    padding: 21px 5vw;

  }

  nav {

    font-size: 7px;

    letter-spacing: .02em;

  }

  .composition {

    width: 96vw;

    height: 52vh;

    min-height: 300px;

  }

  .word-one {

    margin-left: 16%;

    margin-top: 5%;

  }

  .word-two {

    margin-left: 26%;

    margin-top: 2%;

  }

  .letter {

    font-size: 10px;

  }

  .label {

    font-size: 7px;

  }

  .label-top {

    left: 16%;

    top: 24%;

  }

  .label-right {

    right: 2%;

    top: 40%;

  }

  .label-left {

    left: 2%;

    top: 67%;

  }

  .label-bottom {

    right: 2%;

    bottom: 7%;

  }

  footer {

    left: 5vw;

    right: 5vw;

    bottom: 15px;

    font-size: 7px;

  }

}

@media (prefers-reduced-motion: reduce) {

  *,

  *::before,

  *::after {

    animation: none !important;

    transition: none !important;

  }

}

</style>

</head>

<body>

<canvas id="space" aria-hidden="true"></canvas>

<canvas id="grain" aria-hidden="true"></canvas>

<div class="atmosphere"></div>

<div class="vignette"></div>

<header>

  <button class="brand" id="homeButton">

    A LIVING ARCHIVE <span>/ 001</span>

  </button>

  <nav aria-label="Main navigation">

    <a href="#about" data-section="about" data-i18n="navAbout">About me</a>

    <a href="#thoughts" data-section="thoughts" data-i18n="navThoughts">About what I think</a>

    <a href="#reading" data-section="reading" data-i18n="navReading">About what I read</a>

    <a href="#desire" data-section="desire" data-i18n="navDesire">About what I want</a>

  </nav>

  <div class="languages" aria-label="Language selection">

    <button data-lang="zh">中</button>

    <button data-lang="en" class="active">EN</button>

    <button data-lang="fr">FR</button>

  </div>

</header>

<main id="home">

  <section class="composition">

    <div class="registration"></div>

    <div class="cross cross-a"></div>

    <div class="cross cross-b"></div>

    <div class="label label-top" data-i18n="topLabel">

      PERSONAL ARCHIVE<br>

      <span class="accent">A WORK IN PROGRESS</span>

    </div>

    <div class="label label-right" data-i18n="rightLabel">

      AN OPEN<br>SYSTEM

    </div>

    <div class="label label-left" data-i18n="leftLabel">

      NOT FIXED.<br>NOT FINISHED.

    </div>

    <div class="label label-bottom" data-i18n="bottomLabel">

      FORM / THOUGHT / BECOMING

    </div>

    <div class="title-field">

      <div class="word word-one" data-word="STILL"></div>

      <div class="word word-two" data-word="BECOMING"></div>

    </div>

  </section>

</main>

<footer>

  <div>

    <span class="status-dot"></span>

    <span data-i18n="status">SYSTEM EVOLVING</span><br>

    <span>26°N / 114°E</span>

  </div>

  <div class="footer-right">

    <span data-i18n="footerTop">A PERSONAL UNIVERSE</span><br>

    © <span id="year"></span> — STILL IN PROCESS

  </div>

</footer>

<section class="overlay" id="overlay" aria-hidden="true">

  <div class="panel">

    <div class="panel-index" id="panelIndex">ARCHIVE / 001</div>

    <h1 id="panelTitle">About me</h1>

    <p id="panelDescription"></p>

    <button class="close-panel" id="closePanel" data-i18n="back">

      ← Back to the beginning

    </button>

  </div>

</section>

<script>

/* ========================================

   LANGUAGE CONTENT

======================================== */

const translations = {

  en: {

    navAbout: "About me",

    navThoughts: "About what I think",

    navReading: "About what I read",

    navDesire: "About what I want",

    topLabel:

      'PERSONAL ARCHIVE<br><span class="accent">A WORK IN PROGRESS</span>',

    rightLabel: "AN OPEN<br>SYSTEM",

    leftLabel: "NOT FIXED.<br>NOT FINISHED.",

    bottomLabel: "FORM / THOUGHT / BECOMING",

    status: "SYSTEM EVOLVING",

    footerTop: "A PERSONAL UNIVERSE",

    back: "← Back to the beginning",

    sections: {

      about: {

        index: "ARCHIVE / 001",

        title: "About me",

        description:

          "A collection of fragments, experiences and identities. Not a fixed portrait, but a self in continuous formation."

      },

      thoughts: {

        index: "ARCHIVE / 002",

        title: "About what I think",

        description:

          "Notes on design, images, cities, culture and the quiet structures that shape the way we see the world."

      },

      reading: {

        index: "ARCHIVE / 003",

        title: "About what I read",

        description:

          "Books, essays, visual references and ideas that stay with me long after the last page."

      },

      desire: {

        index: "ARCHIVE / 004",

        title: "About what I want",

        description:

          "Unfinished ambitions, possible futures and things I have not yet found the words to describe."

      }

    }

  },

  zh: {

    navAbout: "关于我",

    navThoughts: "关于思考",

    navReading: "关于阅读",

    navDesire: "关于渴望",

    topLabel:

      '个人档案<br><span class="accent">持续生成中</span>',

    rightLabel: "一个开放的<br>系统",

    leftLabel: "未被定义。<br>尚未完成。",

    bottomLabel: "形式 / 思想 / 生成",

    status: "系统持续演变",

    footerTop: "一个私人宇宙",

    back: "← 回到起点",

    sections: {

      about: {

        index: "档案 / 001",

        title: "关于我",

        description:

          "关于身份、经历与自我认知的片段。这不是一幅固定的肖像，而是一个仍在不断形成中的自我。"

      },

      thoughts: {

        index: "档案 / 002",

        title: "关于思考",

        description:

          "关于设计、图像、城市与文化的观察，以及那些悄然影响我们观看世界的结构。"

      },

      reading: {

        index: "档案 / 003",

        title: "关于阅读",

        description:

          "书籍、文章、视觉参考与那些在合上书页之后，仍然留在脑海里的想法。"

      },

      desire: {

        index: "档案 / 004",

        title: "关于渴望",

        description:

          "尚未完成的野心、仍有可能的未来，以及那些暂时还无法准确描述的事物。"

      }

    }

  },

  fr: {

    navAbout: "À propos de moi",

    navThoughts: "Mes réflexions",

    navReading: "Mes lectures",

    navDesire: "Mes aspirations",

    topLabel:

      'ARCHIVE PERSONNELLE<br><span class="accent">EN COURS DE CRÉATION</span>',

    rightLabel: "UN SYSTÈME<br>OUVERT",

    leftLabel: "NON FIXÉE.<br>INACHEVÉE.",

    bottomLabel: "FORME / PENSÉE / DEVENIR",

    status: "SYSTÈME EN ÉVOLUTION",

    footerTop: "UN UNIVERS PERSONNEL",

    back: "← Retour au commencement",

    sections: {

      about: {

        index: "ARCHIVE / 001",

        title: "À propos de moi",

        description:

          "Des fragments d'identité, d'expériences et de perceptions. Non pas un portrait figé, mais un être en formation continue."

      },

      thoughts: {

        index: "ARCHIVE / 002",

        title: "Mes réflexions",

        description:

          "Des notes sur le design, les images, les villes et la culture, ainsi que sur les structures discrètes qui façonnent notre regard."

      },

      reading: {

        index: "ARCHIVE / 003",

        title: "Mes lectures",

        description:

          "Des livres, des essais, des références visuelles et des idées qui persistent bien après la dernière page."

      },

      desire: {

        index: "ARCHIVE / 004",

        title: "Mes aspirations",

        description:

          "Des ambitions inachevées, des futurs possibles et des choses que je ne sais pas encore décrire avec précision."

      }

    }

  }

};

let currentLanguage = "en";

let activeSection = null;

function setLanguage(language) {

  currentLanguage = language;

  document.documentElement.lang =

    language === "zh" ? "zh-CN" : language;

  document.querySelectorAll("[data-i18n]").forEach(element => {

    const key = element.dataset.i18n;

    const value = translations[language][key];

    if (value !== undefined) {

      element.innerHTML = value;

    }

  });

  document.querySelectorAll("[data-lang]").forEach(button => {

    button.classList.toggle(

      "active",

      button.dataset.lang === language

    );

  });

  if (activeSection) {

    openSection(activeSection);

  }

}

document.querySelectorAll("[data-lang]").forEach(button => {

  button.addEventListener("click", () => {

    setLanguage(button.dataset.lang);

  });

});

/* ========================================

   TYPOGRAPHIC INTERACTION

======================================== */

const words = document.querySelectorAll(".word");

const letters = [];

const reducedMotion = window.matchMedia(

  "(prefers-reduced-motion: reduce)"

).matches;

words.forEach(word => {

  [...word.dataset.word].forEach((character, index) => {

    const span = document.createElement("span");

    span.className = "letter";

    span.textContent = character;

    const seed =

      (index + 1) * 1.73 +

      word.dataset.word.length * .41;

    const rotation = Math.sin(seed) * 2.2;

    const driftX = Math.sin(seed * 1.4) * 1.3;

    const driftY = Math.cos(seed * 1.8) * 1.1;

    span.style.transform =

      `translate(${driftX}px, ${driftY}px) rotate(${rotation}deg)`;

    word.appendChild(span);

    letters.push({

      element: span,

      rotation,

      driftX,

      driftY,

      phase: seed

    });

  });

});

let mouseX = -1000;

let mouseY = -1000;

let smoothMouseX = -1000;

let smoothMouseY = -1000;

window.addEventListener("pointermove", event => {

  mouseX = event.clientX;

  mouseY = event.clientY;

}, { passive: true });

window.addEventListener("pointerleave", () => {

  mouseX = -1000;

  mouseY = -1000;

});

function animateLetters(time) {

  smoothMouseX += (mouseX - smoothMouseX) * .08;

  smoothMouseY += (mouseY - smoothMouseY) * .08;

  letters.forEach(letter => {

    const rect = letter.element.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;

    const centerY = rect.top + rect.height / 2;

    const dx = centerX - smoothMouseX;

    const dy = centerY - smoothMouseY;

    const distance = Math.sqrt(dx * dx + dy * dy);

    let pushX = 0;

    let pushY = 0;

    let pushRotation = 0;

    if (!reducedMotion && distance < 150) {

      const force = (150 - distance) / 150;

      pushX = dx / (distance || 1) * force * 5;

      pushY = dy / (distance || 1) * force * 4;

      pushRotation = dx / 150 * force * 2.2;

    }

    const breathingX = reducedMotion

      ? 0

      : Math.sin(time * .00045 + letter.phase) * .6;

    const breathingY = reducedMotion

      ? 0

      : Math.cos(time * .0004 + letter.phase) * .5;

    letter.element.style.transform = `

      translate(

        ${letter.driftX + pushX + breathingX}px,

        ${letter.driftY + pushY + breathingY}px

      )

      rotate(${letter.rotation + pushRotation}deg)

    `;

  });

  requestAnimationFrame(animateLetters);

}

requestAnimationFrame(animateLetters);

/* ========================================

   RESTRAINED COSMIC BACKGROUND

======================================== */

const canvas = document.getElementById("space");

const ctx = canvas.getContext("2d");

let width = 0;

let height = 0;

let dpr = 1;

let paths = [];

let stars = [];

function randomGenerator(seed) {

  let state = seed >>> 0;

  return function() {

    state = (state * 1664525 + 1013904223) >>> 0;

    return state / 4294967296;

  };

}

function buildSpace() {

  const random = randomGenerator(20000907);

  paths = [];

  stars = [];

  /* Fewer lines, with longer quiet intervals */

  const lineCount = Math.max(

    18,

    Math.min(34, Math.floor(width / 42))

  );

  for (let i = 0; i < lineCount; i++) {

    const startX = random() * width;

    const startY = random() * height;

    const length = width * (.18 + random() * .45);

    const direction = random() > .5 ? 1 : -1;

    const bend = (random() - .5) * height * .22;

    paths.push({

      x: startX,

      y: startY,

      length,

      direction,

      bend,

      opacity: .045 + random() * .13,

      lineWidth: .35 + random() * .3,

      phase: random() * Math.PI * 2,

      drift: (random() - .5) * 3,

      curve: random() > .5

    });

  }

  /* Sparse, dim points */

  const starCount = Math.floor(width * height / 13000);

  for (let i = 0; i < starCount; i++) {

    stars.push({

      x: random() * width,

      y: random() * height,

      radius: .15 + random() * .45,

      opacity: .08 + random() * .28

    });

  }

}

function resizeSpace() {

  width = window.innerWidth;

  height = window.innerHeight;

  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(width * dpr);

  canvas.height = Math.round(height * dpr);

  canvas.style.width = width + "px";

  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  buildSpace();

  drawSpace(0);

}

function drawSpace(time) {

  ctx.clearRect(0, 0, width, height);

  /* Quiet points in the distance */

  stars.forEach(star => {

    ctx.beginPath();

    ctx.arc(

      star.x,

      star.y,

      star.radius,

      0,

      Math.PI * 2

    );

    ctx.fillStyle =

      `rgba(230,232,235,${star.opacity})`;

    ctx.fill();

  });

  /* A small number of fine, continuous spatial traces */

  paths.forEach(path => {

    const movement = reducedMotion

      ? 0

      : Math.sin(time * .00013 + path.phase) * path.drift;

    const x1 = path.x;

    const y1 = path.y + movement;

    const x2 = path.x + path.direction * path.length;

    const y2 = path.y + path.bend + movement;

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(x1, y1);

    if (path.curve) {

      const controlX =

        (x1 + x2) / 2 + Math.sin(path.phase) * 30;

      const controlY =

        (y1 + y2) / 2 + path.bend * .25;

      ctx.quadraticCurveTo(

        controlX,

        controlY,

        x2,

        y2

      );

    } else {

      ctx.lineTo(x2, y2);

    }

    ctx.strokeStyle =

      `rgba(225,228,233,${path.opacity})`;

    ctx.lineWidth = path.lineWidth;

    ctx.stroke();

    ctx.restore();

  });

  /* Very subtle cursor atmosphere */

  if (!reducedMotion && mouseX > 0 && mouseY > 0) {

    const radius = 180;

    const glow = ctx.createRadialGradient(

      mouseX,

      mouseY,

      0,

      mouseX,

      mouseY,

      radius

    );

    glow.addColorStop(

      0,

      "rgba(65,108,73,.025)"

    );

    glow.addColorStop(

      1,

      "rgba(65,108,73,0)"

    );

    ctx.fillStyle = glow;

    ctx.fillRect(

      mouseX - radius,

      mouseY - radius,

      radius * 2,

      radius * 2

    );

  }

}

function animateSpace(time) {

  drawSpace(time);

  if (!reducedMotion) {

    requestAnimationFrame(animateSpace);

  }

}

window.addEventListener("resize", resizeSpace);

resizeSpace();

if (!reducedMotion) {

  requestAnimationFrame(animateSpace);

}

/* ========================================

   SOFT FILM GRAIN

======================================== */

const grainCanvas = document.getElementById("grain");

const grainCtx = grainCanvas.getContext("2d");

function resizeGrain() {

  grainCanvas.width = Math.max(

    1,

    Math.ceil(window.innerWidth / 3)

  );

  grainCanvas.height = Math.max(

    1,

    Math.ceil(window.innerHeight / 3)

  );

  grainCanvas.style.width = window.innerWidth + "px";

  grainCanvas.style.height = window.innerHeight + "px";

}

function drawGrain() {

  const imageData = grainCtx.createImageData(

    grainCanvas.width,

    grainCanvas.height

  );

  const data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {

    const value = Math.random() * 255;

    data[i] = value;

    data[i + 1] = value;

    data[i + 2] = value;

    /* Transparent noise: texture rather than dotted lines */

    data[i + 3] = Math.random() * 20;

  }

  grainCtx.putImageData(imageData, 0, 0);

}

resizeGrain();

drawGrain();

let grainTimer;

function animateGrain() {

  drawGrain();

  if (!reducedMotion) {

    grainTimer = setTimeout(() => {

      requestAnimationFrame(animateGrain);

    }, 240);

  }

}

if (!reducedMotion) {

  animateGrain();

}

window.addEventListener("resize", () => {

  resizeGrain();

  drawGrain();

});

/* ========================================

   NAVIGATION

======================================== */

const overlay = document.getElementById("overlay");

const panelIndex = document.getElementById("panelIndex");

const panelTitle = document.getElementById("panelTitle");

const panelDescription = document.getElementById("panelDescription");

function openSection(section) {

  const content = translations[currentLanguage].sections[section];

  if (!content) return;

  activeSection = section;

  panelIndex.textContent = content.index;

  panelTitle.textContent = content.title;

  panelDescription.textContent = content.description;

  overlay.classList.add("open");

  overlay.setAttribute("aria-hidden", "false");

  document.querySelectorAll("nav a").forEach(link => {

    link.classList.toggle(

      "active",

      link.dataset.section === section

    );

  });

  history.replaceState(null, "", "#" + section);

}

function closeSection() {

  activeSection = null;

  overlay.classList.remove("open");

  overlay.setAttribute("aria-hidden", "true");

  document.querySelectorAll("nav a").forEach(link => {

    link.classList.remove("active");

  });

  history.replaceState(

    null,

    "",

    window.location.pathname + window.location.search

  );

}

document.querySelectorAll("nav a").forEach(link => {

  link.addEventListener("click", event => {

    event.preventDefault();

    openSection(link.dataset.section);

  });

});

document.getElementById("homeButton").addEventListener(

  "click",

  closeSection

);

document.getElementById("closePanel").addEventListener(

  "click",

  closeSection

);

document.addEventListener("keydown", event => {

  if (event.key === "Escape") {

    closeSection();

  }

});

overlay.addEventListener("click", event => {

  if (event.target === overlay) {

    closeSection();

  }

});

/* ========================================

   INITIALIZATION

======================================== */

document.getElementById("year").textContent =

  new Date().getFullYear();

setLanguage("en");

</script>
